# Secret scanning configuration.
#
# The bundled rule set is extended, never replaced. The allowlist below covers
# values that are deliberately not credentials. A real secret must be rotated,
# never allowlisted.

title = "Wasla secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Documented placeholders and local development values"
paths = [
  # Template file: every value in it is a placeholder by definition.
  '''^\.env\.example$''',
]
regexes = [
  # Placeholder that production configuration refuses to start with.
  '''change-me''',
  # Signing value used only by the CI test run.
  '''continuous-integration-secret-value-not-for-deployment''',
  # Local Compose credentials for a database that only exists on a laptop.
  '''postgresql\+asyncpg://wasla:wasla@''',
  '''POSTGRES_PASSWORD: wasla''',
  # A test fixture's JWT signing value, long enough to satisfy the setting and
  # therefore long enough to look like a credential. The working tree generates
  # this value now (tests/integration/test_billing_worker.py); the literal
  # survives in commit 420ea01, which the history scan still reaches.
  '''a-test-secret-that-is-long-enough-32''',
]
