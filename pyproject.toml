[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wasla"
version = "0.1.0"
description = "Wasla - multi-tenant AI customer engagement platform for WhatsApp Business"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.141.1,<0.142",
    # Declared rather than left to FastAPI. The application imports Starlette
    # directly - Request, the middleware base - so it is a real dependency, and
    # FastAPI asks only for `starlette>=0.46.0`, which happily resolved to a
    # release carrying five advisories. The floor here is the security floor.
    "starlette>=1.6,<2",
    "uvicorn[standard]>=0.34,<0.36",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    # pgvector's SQLAlchemy type. The extension itself is enabled by migration
    # 0001; this is the mapping that lets a Vector column be declared and
    # queried like any other (ADR-008).
    "pgvector>=0.3.6,<0.5",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "httpx>=0.28,<0.29",
    # Authentication: Argon2id password hashing, JWT encoding, and address
    # validation for the email identities those tokens are issued to.
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",
    # AES-GCM for credentials at rest (ADR-034). Declared rather than relied on
    # transitively: it was already installed here as somebody else's dependency,
    # and an undeclared import is a deployment that works until the package that
    # happened to pull it in is removed. The floor is the security floor - this
    # library is where the project's cryptography actually lives (ADR-017).
    "cryptography>=50,<51",
    # PDF text extraction, for documents customers send over WhatsApp and for
    # the knowledge base, which has refused PDFs since phase 6 for want of a
    # parser. Pure Python and dependency-free, which matters for a library that
    # is fed attachments from strangers.
    "pypdf>=5.1,<7",
    # Multipart form parsing, for the attachment upload endpoint. Starlette
    # imports it lazily and raises at request time without it, so an undeclared
    # copy that happens to be installed is a 500 waiting for a deployment that
    # does not have one. The floor is the security floor: releases before
    # 0.0.18 carry a denial-of-service advisory in the parser, which is exactly
    # the code path an uploaded file reaches (ADR-017).
    "python-multipart>=0.0.18,<0.1",
    # Distributed tracing (ADR-083). Three packages and no auto-instrumentation:
    # the API for the span vocabulary, the SDK for the provider, sampler and
    # batching processor, and the OTLP/HTTP exporter, which is the protocol
    # every collector speaks and the one that needs no gRPC stack. The
    # `-instrumentation-*` packages are deliberately absent - see the argument
    # in `app/core/tracing.py`: each of them exports request paths, full URLs
    # or SQL text by default, and the privacy control would then be a setting
    # in a package this repository does not own.
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]

[project.optional-dependencies]
# Pinned exactly, not ranged. These tools gate CI on style and typing, and a
# new release changing a default turns a green pipeline red without a commit
# touching the project. Upgrading is a deliberate change with its own diff.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==26.5.1",
    "mypy==1.20.2",
    # Stubs for the one third-party library the tests import that ships none.
    # `tests/unit/test_delivery_pipeline.py` reads the GitHub Actions workflows
    # to check what CI actually runs, and without these mypy has no types for
    # `yaml.safe_load` - which is a real gap rather than something to silence
    # with a per-module override.
    "types-PyYAML==6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Project root: "app" must resolve as first-party from tests/ and alembic/ too.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "T20", "ANN", "RUF"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The alembic/ directory here shadows the installed alembic package during
# first-party detection, so state the classification explicitly.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Test helpers follow the same annotation policy as the test functions, and
# credentials appearing in tests are fake by construction.
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "ANN001",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
]
# The one file in the suite that is a *process* rather than a test. It is
# launched by `test_media_crash_recovery.py` and killed from outside mid-write,
# and stdout is the only channel it has back to the parent - so `print` here is
# the interface, not a leftover debug statement (ADR-087).
"tests/integration/interrupted_upload_child.py" = ["T201"]
"alembic/**" = ["ANN", "INP001", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = "^alembic/versions/"

[[tool.mypy.overrides]]
# Insurance: the published wheel is typed, but a build without py.typed must
# not turn into a strict-mode failure across the auth code.
module = ["argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pgvector ships no py.typed marker. Only the Vector column type is imported
# from it, and the model declares that column's Python type itself, so nothing
# downstream loses checking.
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: exercises the ASGI application or infrastructure adapters",
    "e2e: exercises a full end-to-end flow",
    # Opt-in, and skipped without OPENAI_API_KEY so CI stays green without
    # credentials. These call the real provider and cost real money.
    "real_provider: calls a real external provider; needs credentials",
]
