# promtool unit tests for the lifecycle alert rules.
#
# Proves the rules do what their names say against synthetic series: the alert
# enters firing state when the condition holds for its `for:` duration, and
# stops when it stops. That is the half of "alerting works" that can be proved
# without a chat webhook.
# Relative to this file, so the tests live beside the rules they check.
rule_files:
  - ../alerts.yml

evaluation_interval: 30s

tests:
  # --------------------------------------------------------------- 5xx rule
  - interval: 30s
    name: lifecycle 5xx fires after ten minutes and clears on recovery
    input_series:
      - series: 'wasla_http_requests_total{job="wasla-api", route="/api/v1/auth/logout-all", status="5xx", method="POST"}'
        # Rising for 20 minutes, then flat - flat means the rate decays to zero,
        # which is what recovery looks like for a counter.
        values: "0+1x40 40+0x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: LifecycleEndpointErrors
        # Errors are happening, but not yet for the 10m the rule requires.
        exp_alerts: []
      - eval_time: 15m
        alertname: LifecycleEndpointErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              component: lifecycle
              route: /api/v1/auth/logout-all
            exp_annotations:
              summary: "Lifecycle endpoint /api/v1/auth/logout-all is returning 5xx"
              description: >-
                A security or lifecycle operation is failing after the caller was authorised. The most likely causes are a database enum the code writes and the schema does not carry (see AUTH-01 and tests/integration/test_schema_parity.py), a migration that has not been applied, or a dependency that is down. Check the application logs for the request id and the exception.
              runbook: docs/RUNBOOK.md
      - eval_time: 39m
        alertname: LifecycleEndpointErrors
        # The counter stopped rising, so the rate fell back to zero.
        exp_alerts: []

  # ------------------------------------------------------------ orphan rule
  - interval: 30s
    name: an orphaned workspace fires and clears when ownership is repaired
    input_series:
      - series: 'wasla_orphaned_workspaces{job="wasla-api"}'
        values: "0+0x40 1+0x40 0+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: OrphanedWorkspace
        exp_alerts: []
      - eval_time: 40m
        alertname: OrphanedWorkspace
        exp_alerts:
          - exp_labels:
              severity: critical
              component: tenancy
              job: wasla-api
            exp_annotations:
              summary: "1 active workspace(s) have no owner"
              description: >-
                Platform deletion of a last owner is supposed to suspend the workspace automatically. A non-zero value here means that did not happen, or the state was produced another way. Identify the workspaces with the query in docs/RUNBOOK.md and repair ownership with POST /api/v1/platform/tenants/{id}/ownership.
              runbook: docs/RUNBOOK.md
      - eval_time: 62m
        alertname: OrphanedWorkspace
        exp_alerts: []

  # ------------------------------------------------------- scrape-down rule
  - interval: 30s
    name: a target that stops answering is itself an alert
    input_series:
      - series: 'up{job="wasla-api", instance="api:8000"}'
        values: "1+0x20 0+0x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: application
              job: wasla-api
              instance: api:8000
            exp_annotations:
              summary: "Prometheus cannot scrape the Wasla API"
              description: >-
                No metrics are arriving, so no other alert in this file can fire. Treat a silent monitoring system as an incident in its own right.
              runbook: docs/RUNBOOK.md

  # ---------------------------------------------------- refresh token replay
  - interval: 30s
    name: a single replayed refresh token fires, and clears once it stops
    input_series:
      # One increment, at t=0, then flat. A counter that stops rising is a
      # rate that decays to zero, which is what "no further replays" looks
      # like - so this case also proves the alert resolves rather than
      # latching on for ever.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="refresh", outcome="blocked", reason="replay"}'
        values: "0+0x2 1+0x60"
      # Ordinary successful refreshes, deliberately present: the rule must not
      # be satisfied by traffic on the same metric with a different outcome.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="refresh", outcome="success", reason="rotated"}'
        values: "0+10x60"
    alert_rule_test:
      - eval_time: 30s
        alertname: RefreshTokenReplayDetected
        # The increment has not landed yet, and successful refreshes alone
        # must never fire this.
        exp_alerts: []
      - eval_time: 4m
        alertname: RefreshTokenReplayDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              component: security
            exp_annotations:
              summary: "A refresh token was replayed"
              description: >-
                A refresh token was presented twice. Wasla has already revoked the account's whole token family, so every session it held is dead and the person will be asked to sign in again. Establish which it was: audit_logs carries a refresh_token_reused row naming the account and the version it was raised to. Two causes are worth telling apart - a leaked token being used by somebody else, and a client that retries a refresh with the token it has already spent.
              runbook: docs/RUNBOOK.md
      - eval_time: 20m
        alertname: RefreshTokenReplayDetected
        # The 5m rate window has moved past the single increment.
        exp_alerts: []

  # ------------------------------------------------------ login failure rate
  - interval: 30s
    name: ordinary mistyped passwords stay quiet
    input_series:
      # ~0.033/s - two failures a minute, which is a normal product. Well
      # under the 0.2/s threshold, and it runs for the whole window so this is
      # a real negative control rather than an absence of data.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="login", outcome="failure", reason="invalid_credentials"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: PasswordLoginFailureSpike
        exp_alerts: []

  - interval: 30s
    name: a sustained login-failure spike fires after fifteen minutes
    input_series:
      # 0.4/s across two reasons - twelve a minute each. Split deliberately:
      # neither series alone would cross the threshold, and the rule sums them
      # because a list-walking attacker produces exactly this mixture.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="login", outcome="failure", reason="invalid_credentials"}'
        values: "0+6x120"
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="login", outcome="failure", reason="account_deleted"}'
        values: "0+6x120"
      # Successes at a healthy rate, which must not suppress or satisfy it.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="login", outcome="success", reason="password"}'
        values: "0+3x120"
    alert_rule_test:
      - eval_time: 10m
        alertname: PasswordLoginFailureSpike
        # Over threshold, but not yet for the fifteen minutes the rule wants.
        exp_alerts: []
      - eval_time: 30m
        alertname: PasswordLoginFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              component: security
            exp_annotations:
              summary: "Password logins are failing far above the normal rate"
              description: >-
                Sustained password-login failures. Most likely a credential-stuffing or spray attempt; a broken client that retries a bad credential in a loop looks the same from here and is also worth stopping. The per-account and per-address limits are already refusing the excess - check wasla_auth_security_events_total{event="rate_limit"} to see whether they are engaged, and the audit trail for login_failed rows to see which accounts are being named.
              runbook: docs/RUNBOOK.md

  # ---------------------------------------------------------- rate limiting
  - interval: 30s
    name: a rate-limit spike names which budget is being spent
    input_series:
      # 0.4/s on the per-account budget, which is what a targeted attempt on
      # one person looks like once the limiter engages.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="rate_limit", outcome="blocked", reason="account"}'
        values: "0+12x120"
      # And a trickle on the per-client budget, under threshold. It must not
      # produce a second alert: the split by `reason` is what makes the first
      # actionable, and it would be worthless if every reason fired together.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="rate_limit", outcome="blocked", reason="client"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 10m
        alertname: AuthenticationRateLimitSpike
        exp_alerts: []
      - eval_time: 30m
        alertname: AuthenticationRateLimitSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              component: security
              reason: account
            exp_annotations:
              summary: "Authentication rate limiting is engaged (account)"
              description: >-
                The authentication limiters are refusing traffic at a sustained rate. reason=client is a single caller being throttled; reason=account means one account's login budget is being spent, which is what a targeted attempt on a named person looks like; reason=account_reset is the password-reset budget, which bounds the reset endpoint's use as a mailbox-flooding tool. The limits are working - this says somebody is pushing against them.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------- email webhook signatures
  - interval: 30s
    name: one stray unsigned callback is not an incident
    input_series:
      # A single refusal at t=0 and nothing after. Somebody probed the
      # endpoint once; that is not worth anybody's afternoon.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="email_webhook", outcome="blocked", reason="invalid_signature"}'
        values: "0+0x2 1+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: EmailWebhookSignatureFailures
        exp_alerts: []

  - interval: 30s
    name: a provider secret mismatch fires as a warning
    input_series:
      # ~0.033/s - two refusals a minute, sustained. That is a secret that no
      # longer matches, not a passer-by.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="email_webhook", outcome="blocked", reason="invalid_signature"}'
        values: "0+1x160"
      # Accepted callbacks alongside them, so the rule is shown to select on
      # the outcome rather than on the event.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="email_webhook", outcome="success", reason="recorded"}'
        values: "0+4x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: EmailWebhookSignatureFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: EmailWebhookSignatureFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: security
            exp_annotations:
              summary: "Email webhook callbacks are failing signature verification"
              description: >-
                Repeated callbacks are being refused before they are parsed. Check that RESEND_WEBHOOK_SECRET matches the signing secret configured at the provider - a mismatch means delivery, bounce and complaint events are being discarded, so suppression will stop working while the endpoint keeps answering. If the secret is correct, this is unsigned traffic reaching the endpoint from somewhere else.
              runbook: docs/EMAIL.md

  # ==========================================================================
  # Messaging. Every rule below is exercised twice - once under its threshold
  # and once over it - because a rule that only ever fires has not been shown
  # to discriminate, and a threshold nobody tested from below is a threshold
  # that pages on ordinary traffic.

  # --------------------------------------------------- inbound stopped
  - interval: 30s
    name: a quiet deployment with no traffic today does not page
    input_series:
      # Flat at zero for the whole window: nothing has ever arrived, so there
      # is nothing to have stopped. This is the guard that keeps a new or
      # dormant deployment off the pager.
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="inbound_webhook", outcome="success"}'
        values: "0+0x200"
    alert_rule_test:
      - eval_time: 90m
        alertname: WhatsAppInboundStopped
        exp_alerts: []

  - interval: 30s
    name: inbound stopping on a deployment that had traffic pages
    input_series:
      # Climbing for two hours, then flat. Flat means the rate decays to zero,
      # which is exactly what "Meta stopped delivering" looks like on a
      # counter - while the 24h increase still remembers the earlier traffic.
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="inbound_webhook", outcome="success"}'
        values: "0+1x240 240+0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: WhatsAppInboundStopped
        # Messages are still arriving.
        exp_alerts: []
      - eval_time: 180m
        alertname: WhatsAppInboundStopped
        exp_alerts:
          - exp_labels:
              severity: critical
              component: messaging
            exp_annotations:
              summary: "No WhatsApp messages have arrived for 30 minutes"
              description: >-
                Inbound webhook deliveries have stopped, on a deployment that was receiving them today. Check that Meta has not disabled the subscription (App Dashboard, Webhooks), that the callback URL still resolves and still presents a valid certificate, and that the reverse proxy is forwarding POSTs to /api/v1/webhooks/whatsapp. A repeated 5xx or a repeated signature failure will make Meta disable the subscription, so check WhatsAppWebhookSignatureFailures too.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------- webhook signatures
  - interval: 30s
    name: one stray unsigned WhatsApp delivery is not an incident
    input_series:
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="whatsapp_webhook", outcome="blocked", reason="invalid_signature"}'
        values: "0+0x2 1+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: WhatsAppWebhookSignatureFailures
        exp_alerts: []

  - interval: 30s
    name: a drifted app secret pages, because every message is being dropped
    input_series:
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="whatsapp_webhook", outcome="blocked", reason="invalid_signature"}'
        values: "0+1x160"
      # The email webhook's own refusals alongside, so the rule is shown to
      # select on `event` rather than firing on any signature failure.
      - series: 'wasla_auth_security_events_total{job="wasla-api", event="email_webhook", outcome="blocked", reason="invalid_signature"}'
        values: "0+0x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: WhatsAppWebhookSignatureFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: WhatsAppWebhookSignatureFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              component: messaging
            exp_annotations:
              summary: "WhatsApp webhook deliveries are failing signature verification"
              description: >-
                Deliveries are being refused before they are parsed. Check that META_APP_SECRET matches the app secret in Meta's App Dashboard - a mismatch means every customer message is being dropped with a 403, and Meta disables a subscription that keeps failing. If the secret is correct, this is unsigned traffic arriving from somewhere else.
              runbook: docs/WHATSAPP.md

  # ------------------------------------------------------- send failures
  - interval: 30s
    name: a few refused sends among many good ones do not alert
    input_series:
      # One failure for every twenty successes: customers writing outside the
      # service window, which is ordinary and is not an incident.
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="send_message", outcome="success"}'
        values: "0+20x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="send_message", outcome="failure"}'
        values: "0+1x160"
    alert_rule_test:
      - eval_time: 45m
        alertname: WhatsAppSendFailureRate
        exp_alerts: []

  - interval: 30s
    name: a revoked token fires the send failure rate
    input_series:
      # Nothing succeeding at all, which is what a dead credential looks like.
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="send_message", outcome="success"}'
        values: "0+0x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="send_message", outcome="failure"}'
        values: "0+4x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: WhatsAppSendFailureRate
        exp_alerts: []
      - eval_time: 45m
        alertname: WhatsAppSendFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: messaging
            exp_annotations:
              summary: "More than a fifth of WhatsApp sends are failing"
              description: >-
                Replies are not reaching customers. The usual causes are a revoked or expired access token (look for whatsapp.credential_refused), a template Meta has paused since it was last synced, or Meta itself being degraded. Note that an outcome of "unavailable" means the send may have been delivered anyway - see the unresolved-sends runbook before anybody retries anything by hand.
              runbook: docs/RUNBOOK.md

  # -------------------------------------------------------- rate limiting
  - interval: 30s
    name: an occasional 429 is absorbed by the retry and does not alert
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="send_message", outcome="rate_limited"}'
        values: "0+0x40 1+0x160"
    alert_rule_test:
      - eval_time: 45m
        alertname: WhatsAppRateLimited
        exp_alerts: []

  - interval: 30s
    name: sustained throttling alerts
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="whatsapp", operation="send_message", outcome="rate_limited"}'
        values: "0+3x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: WhatsAppRateLimited
        exp_alerts: []
      - eval_time: 45m
        alertname: WhatsAppRateLimited
        exp_alerts:
          - exp_labels:
              severity: warning
              component: messaging
            exp_annotations:
              summary: "WhatsApp is rate limiting outbound sends"
              description: >-
                Meta is refusing sends with 429. Check whether a campaign's messages_per_minute exceeds what the number's tier allows, and whether the number's quality rating has dropped - Meta lowers the throughput limit when it does.
              runbook: docs/CAMPAIGNS.md

  # ----------------------------------------------- unprocessed inbound
  - interval: 30s
    name: a brief backlog during a Redis restart is drained, not paged
    input_series:
      # Three events appear, and the recovery sweep clears them inside the
      # `for:` window. This is the expected shape of a Redis restart and it
      # must not wake anybody.
      - series: 'wasla_unprocessed_inbound_events{job="wasla-api"}'
        values: "0+0x20 3+0x10 0+0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: UnprocessedInboundBacklog
        exp_alerts: []

  - interval: 30s
    name: a backlog nothing is draining pages
    input_series:
      # Events accumulating and staying. Recovery is not running, or cannot
      # reach Redis: customers have written in and nothing will answer them.
      - series: 'wasla_unprocessed_inbound_events{job="wasla-api"}'
        values: "0+0x10 0+1x200"
    alert_rule_test:
      - eval_time: 10m
        alertname: UnprocessedInboundBacklog
        exp_alerts: []
      - eval_time: 60m
        alertname: UnprocessedInboundBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              component: messaging
              job: wasla-api
            exp_annotations:
              summary: "Inbound WhatsApp messages are stored but unanswered"
              description: >-
                Customer messages were accepted and no worker was told to answer them. They are recoverable and not lost. Check that a worker process is running the inbound_recovery loop and that Redis is reachable from it; list the backlog with `python -m app.workers.queues unprocessed-inbound`.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------ unresolved outbound
  - interval: 30s
    name: a send in flight is not an unresolved send
    input_series:
      # Seconds old, which is every send while the provider call is open.
      - series: 'wasla_oldest_unresolved_outbound_age_seconds{job="wasla-api"}'
        values: "0+2x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: UnresolvedOutboundSends
        exp_alerts: []

  - interval: 30s
    name: a send unconfirmed for an hour alerts
    input_series:
      # Climbing past an hour and staying there: the answer never came back.
      - series: 'wasla_oldest_unresolved_outbound_age_seconds{job="wasla-api"}'
        values: "3000+30x200"
    alert_rule_test:
      - eval_time: 10m
        alertname: UnresolvedOutboundSends
        exp_alerts: []
      - eval_time: 60m
        alertname: UnresolvedOutboundSends
        exp_alerts:
          - exp_labels:
              severity: warning
              component: messaging
              job: wasla-api
            exp_annotations:
              summary: "A WhatsApp send has been unresolved for over an hour"
              description: >-
                One or more sends were committed, asked of Meta, and never confirmed, so it is unknown whether the customer received them. These are never retried automatically - a retry is the one action that can put a second copy on somebody's phone. List them with `python -m app.workers.queues unresolved-sends` and follow the unresolved-sends procedure in the runbook.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------------------ queue lag
  - interval: 30s
    name: a job waiting a couple of minutes is a busy worker, not an outage
    input_series:
      - series: 'wasla_queue_oldest_pending_age_seconds{job="wasla-api", queue="agent"}'
        values: "0+4x200"
    alert_rule_test:
      - eval_time: 45m
        alertname: QueueJobsStuck
        exp_alerts: []

  - interval: 30s
    name: a job nobody is consuming alerts
    input_series:
      - series: 'wasla_queue_oldest_pending_age_seconds{job="wasla-api", queue="agent"}'
        values: "800+30x200"
    alert_rule_test:
      - eval_time: 2m
        alertname: QueueJobsStuck
        exp_alerts: []
      - eval_time: 45m
        alertname: QueueJobsStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              component: messaging
            exp_annotations:
              summary: "Queued work has been waiting over fifteen minutes"
              description: >-
                A job has sat unclaimed far longer than any of these should take. Either no worker is consuming that queue - check WORKER_KINDS and that the worker container is healthy - or the workers are saturated by a backlog. On the agent queue this is a customer waiting for a reply.
              runbook: docs/RUNBOOK.md

  # ---------------------------------------------------------- dead letters
  - interval: 30s
    name: a dead letter queue that is not growing does not alert
    input_series:
      # Two records from an old incident, sitting where they were left. The
      # rule reads the increase, so a standing depth is not an alert.
      - series: 'wasla_queue_dead_letter_jobs{job="wasla-api", queue="agent"}'
        values: "2+0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: DeadLetterGrowth
        exp_alerts: []

  - interval: 30s
    name: jobs being dead-lettered now alerts
    input_series:
      - series: 'wasla_queue_dead_letter_jobs{job="wasla-api", queue="agent"}'
        values: "0+1x200"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeadLetterGrowth
        exp_alerts: []
      - eval_time: 60m
        alertname: DeadLetterGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              component: messaging
            exp_annotations:
              summary: "Jobs are being dead-lettered"
              description: >-
                Work has stopped being retried and is waiting for a person. Inspect it with `python -m app.workers.queues dead-letters <queue>`. Replaying the agent queue is refused without --force on purpose: a turn that failed after the provider was engaged may already have sent the customer a reply.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------- worker heartbeats, WQ-05
  - interval: 30s
    name: every worker kind beating does not alert
    input_series:
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="agent"}'
        values: "1+0x200"
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="recovery"}'
        values: "1+0x200"
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="ingestion_recovery"}'
        values: "1+0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: WorkerLoopNotBeating
        exp_alerts: []

  - interval: 30s
    name: a worker that misses one beat does not alert before the for duration
    input_series:
      # Alive, then a two-minute gap in the heartbeat, then alive again - a
      # container restart, or one slow Redis round trip. The `for: 5m` is what
      # separates that from a worker that is gone.
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="agent"}'
        values: "1+0x20 0+0x4 1+0x200"
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkerLoopNotBeating
        exp_alerts: []

  - interval: 30s
    name: a worker kind that stops beating alerts
    input_series:
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="recovery"}'
        values: "1+0x10 0+0x200"
    alert_rule_test:
      - eval_time: 7m
        alertname: WorkerLoopNotBeating
        exp_alerts: []
      - eval_time: 30m
        alertname: WorkerLoopNotBeating
        exp_alerts:
          - exp_labels:
              severity: critical
              component: workers
              kind: recovery
            exp_annotations:
              summary: "The recovery worker loop has stopped beating"
              description: >-
                A worker kind has not refreshed its liveness key inside its expiry, so either the worker container is not running, its event loop is blocked, or WORKER_KINDS no longer selects this loop. Nothing this kind is responsible for is being done. If it is `recovery`, the deployment currently has no crash recovery at all; if it is `inbound_recovery` or `ingestion_recovery`, work lost to a Redis outage is no longer being repaired. Check the worker container's health and logs.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: a worker kind that never started is a zero rather than a gap
    input_series:
      # The case §33 of the remediation brief insists on. The exposition
      # iterates the whole worker inventory and publishes 0 for a kind that has
      # never beaten, so "the container was deployed without this loop" reaches
      # the rule as a zero series rather than as an absent one - which an
      # expression matching only stale series would have missed entirely.
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="ingestion_recovery"}'
        values: "0+0x200"
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", kind="agent"}'
        values: "1+0x200"
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkerLoopNotBeating
        exp_alerts:
          - exp_labels:
              severity: critical
              component: workers
              kind: ingestion_recovery
            exp_annotations:
              summary: "The ingestion_recovery worker loop has stopped beating"
              description: >-
                A worker kind has not refreshed its liveness key inside its expiry, so either the worker container is not running, its event loop is blocked, or WORKER_KINDS no longer selects this loop. Nothing this kind is responsible for is being done. If it is `recovery`, the deployment currently has no crash recovery at all; if it is `inbound_recovery` or `ingestion_recovery`, work lost to a Redis outage is no longer being repaired. Check the worker container's health and logs.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: one replica reading stale does not hide a kind the other says is alive
    input_series:
      # Two API replicas render the same gauge from the same Redis keys. `min
      # by (kind)` is what makes a genuine death visible through that, and it is
      # also what could make a single replica's blip fire - so both replicas
      # disagreeing briefly is asserted not to alert.
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", instance="a", kind="billing"}'
        values: "1+0x200"
      - series: 'wasla_worker_heartbeat_alive{job="wasla-api", instance="b", kind="billing"}'
        values: "1+0x20 0+0x4 1+0x200"
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkerLoopNotBeating
        exp_alerts: []

  # --------------------------------------------- unindexed documents, WQ-03
  - interval: 30s
    name: a document indexed promptly does not alert
    input_series:
      # Uploaded, pending for a couple of minutes, indexed. The ordinary life
      # of every document, and the reason this rule is on age rather than on
      # existence.
      - series: 'wasla_oldest_pending_document_age_seconds{job="wasla-api"}'
        values: "0+30x8 0+0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: UnindexedDocumentBacklog
        exp_alerts: []

  - interval: 30s
    name: a document nobody indexed for half an hour alerts
    input_series:
      - series: 'wasla_oldest_pending_document_age_seconds{job="wasla-api"}'
        values: "0+30x200"
    alert_rule_test:
      - eval_time: 20m
        alertname: UnindexedDocumentBacklog
        exp_alerts: []
      - eval_time: 60m
        alertname: UnindexedDocumentBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              component: workers
              job: wasla-api
            exp_annotations:
              summary: "An uploaded document has been unsearchable for over half an hour"
              description: >-
                A customer uploaded a document successfully and it is still not indexed, so no agent can answer from it. The content is not lost. List the backlog with `python -m app.workers.queues unindexed-documents`: a last error of `-` means the job never ran (check the ingestion and ingestion_recovery loops and Redis); a provider code means indexing is backing off after embedding failures (check EmbeddingProviderUnavailable).
              runbook: docs/RUNBOOK.md

  # ==================================================================== AI
  # Every AI rule twice: under its threshold and over it (AI-09).

  # -------------------------------------------------- provider failure rate
  - interval: 30s
    name: an occasional failed AI call among many successes does not alert
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="success"}'
        values: "0+20x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="failure"}'
        values: "0+1x160"
    alert_rule_test:
      - eval_time: 45m
        alertname: OpenAIRequestFailureRate
        exp_alerts: []

  - interval: 30s
    name: AI calls that mostly fail alert
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="success"}'
        values: "0+0x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="respond_sentiment", outcome="failure"}'
        values: "0+4x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenAIRequestFailureRate
        exp_alerts: []
      - eval_time: 45m
        alertname: OpenAIRequestFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ai
            exp_annotations:
              summary: "More than a fifth of AI provider calls are failing"
              description: >-
                Agent turns and sentiment readings are failing after their retries. Check wasla_provider_requests_total by operation to see whether it is respond_agent, respond_sentiment or respond_vision, and the worker logs for openai.request_failed with its status and provider code. A 401 or 403 is the API key; a 5xx is the provider.
              runbook: docs/RUNBOOK.md

  # --------------------------------------------------- provider throttling
  - interval: 30s
    name: a single throttled attempt the retry absorbed does not alert
    input_series:
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="rate_limited"}'
        values: "0+0x40 1+0x160"
    alert_rule_test:
      - eval_time: 45m
        alertname: OpenAIRateLimited
        exp_alerts: []

  - interval: 30s
    name: sustained throttled attempts alert even when calls eventually succeed
    input_series:
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="rate_limited"}'
        values: "0+3x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="success"}'
        values: "0+3x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenAIRateLimited
        exp_alerts: []
      - eval_time: 45m
        alertname: OpenAIRateLimited
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ai
            exp_annotations:
              summary: "OpenAI is rate limiting this deployment"
              description: >-
                Provider attempts are being refused with 429 at a sustained rate, whether or not the retries eventually succeed, so customers are waiting longer for replies. Check the account's request and token limits with the provider and whether traffic has outgrown them.
              runbook: docs/RUNBOOK.md

  # -------------------------------------------------- provider unavailable
  - interval: 30s
    name: a trickle of provider server errors stays under the page
    input_series:
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="unavailable"}'
        values: "0+1x100"
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenAIUnavailable
        exp_alerts: []

  - interval: 30s
    name: a provider outage pages
    input_series:
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="unavailable"}'
        values: "0+3x100"
    alert_rule_test:
      - eval_time: 5m
        alertname: OpenAIUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: OpenAIUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              component: ai
            exp_annotations:
              summary: "OpenAI is unreachable or failing with server errors"
              description: >-
                Provider attempts are failing with transport errors or 5xx responses. Agent turns that exhaust their retries are left engaged and are not retried, so their customers are not being answered. Check the provider's status and this deployment's egress to api.openai.com.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------------- stranded turns
  - interval: 30s
    name: a stranded turn a person resolves inside the window does not page
    input_series:
      - series: 'wasla_agent_turns_engaged_unfinished{job="wasla-api"}'
        values: "0x10 1x10 0x100"
    alert_rule_test:
      - eval_time: 40m
        alertname: AgentTurnsStranded
        exp_alerts: []

  - interval: 30s
    name: a turn left stranded alerts
    input_series:
      - series: 'wasla_agent_turns_engaged_unfinished{job="wasla-api"}'
        values: "0x10 1x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentTurnsStranded
        exp_alerts: []
      - eval_time: 40m
        alertname: AgentTurnsStranded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ai
            exp_annotations:
              summary: "Agent turns engaged a provider and never finished"
              description: >-
                At least one customer message had an agent turn engaged more than fifteen minutes ago that never finished, so it was not answered and will not be retried automatically. List the turns with the query in the runbook, read each conversation and answer by hand; do not replay the job, because a reply may already have been sent.
              runbook: docs/RUNBOOK.md

  # ------------------------------------------------------- empty answers
  - interval: 30s
    name: one empty answer is handled and does not alert
    input_series:
      - series: 'wasla_agent_turn_outcomes_total{job="wasla-api", outcome="empty_response"}'
        values: "0+0x100 1+0x200"
    alert_rule_test:
      - eval_time: 70m
        alertname: AgentEmptyResponses
        exp_alerts: []

  - interval: 30s
    name: a sustained run of empty answers alerts
    input_series:
      - series: 'wasla_agent_turn_outcomes_total{job="wasla-api", outcome="empty_response"}'
        values: "0+1x300"
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentEmptyResponses
        exp_alerts: []
      - eval_time: 70m
        alertname: AgentEmptyResponses
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ai
            exp_annotations:
              summary: "The AI is producing empty answers"
              description: >-
                Agent turns are ending with no words from the provider, so customers are being sent a holding message and handed to a colleague. A sustained rate usually means the provider changed its response shape or a model is refusing; check the agent.empty_response log.
              runbook: docs/RUNBOOK.md

  # ==================================================================== RAG
  # Every RAG rule twice: under its threshold and over it (RAG-05).

  - interval: 30s
    name: an occasional failed embedding among many successes does not alert
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="embed_query", outcome="success"}'
        values: "0+20x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="embed_query", outcome="failure"}'
        values: "0+1x160"
    alert_rule_test:
      - eval_time: 60m
        alertname: EmbeddingProviderUnavailable
        exp_alerts: []

  - interval: 30s
    name: a rejected embedding key alerts
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="embed_ingest", outcome="failure"}'
        values: "0+5x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: EmbeddingProviderUnavailable
        exp_alerts: []
      - eval_time: 60m
        alertname: EmbeddingProviderUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              component: rag
            exp_annotations:
              summary: "Embedding calls are failing"
              description: >-
                More than a fifth of embedding calls are failing after their retries, so documents are not being indexed and knowledge searches are answering without the knowledge base. Split wasla_provider_requests_total by operation (embed_ingest, embed_query) and outcome: failure is a refusal - check the API key and OPENAI_EMBEDDING_MODEL, and `python -m app.workers.queues failed-documents` for the code - while unavailable is the provider.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: failing agent calls do not raise the embedding alert, nor embeddings the agent one
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="respond_agent", outcome="failure"}'
        values: "0+5x160"
      - series: 'wasla_provider_requests_total{job="wasla-api", provider="openai", operation="embed_query", outcome="success"}'
        values: "0+5x160"
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="embed_query", outcome="unavailable"}'
        values: "0+5x160"
    alert_rule_test:
      - eval_time: 60m
        alertname: EmbeddingProviderUnavailable
        exp_alerts: []
      - eval_time: 60m
        alertname: OpenAIUnavailable
        exp_alerts: []

  - interval: 30s
    name: a rare embedding rate limit does not alert
    input_series:
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="embed_ingest", outcome="rate_limited"}'
        values: "0+0x100 1+0x100"
    alert_rule_test:
      - eval_time: 60m
        alertname: EmbeddingRateLimited
        exp_alerts: []

  - interval: 30s
    name: sustained embedding rate limiting alerts
    input_series:
      - series: 'wasla_provider_attempts_total{job="wasla-api", provider="openai", operation="embed_ingest", outcome="rate_limited"}'
        values: "0+3x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: EmbeddingRateLimited
        exp_alerts: []
      - eval_time: 60m
        alertname: EmbeddingRateLimited
        exp_alerts:
          - exp_labels:
              severity: warning
              component: rag
            exp_annotations:
              summary: "OpenAI is rate limiting embedding calls"
              description: >-
                Embedding attempts are being refused with 429 at a sustained rate. Indexing backs off and retries, and searches wait longer; check the account's embedding limits and whether a bulk upload or a stale-embedding re-index is running.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: occasional failed knowledge searches do not alert
    input_series:
      - series: 'wasla_rag_retrievals_total{job="wasla-api", outcome="found"}'
        values: "0+10x160"
      - series: 'wasla_rag_retrievals_total{job="wasla-api", outcome="empty"}'
        values: "0+10x160"
      - series: 'wasla_rag_retrievals_total{job="wasla-api", outcome="failed"}'
        values: "0+1x160"
    alert_rule_test:
      - eval_time: 60m
        alertname: RAGRetrievalFailureRate
        exp_alerts: []

  - interval: 30s
    name: knowledge searches that mostly fail alert
    input_series:
      - series: 'wasla_rag_retrievals_total{job="wasla-api", outcome="found"}'
        values: "0+1x160"
      - series: 'wasla_rag_retrievals_total{job="wasla-api", outcome="failed"}'
        values: "0+4x160"
    alert_rule_test:
      - eval_time: 10m
        alertname: RAGRetrievalFailureRate
        exp_alerts: []
      - eval_time: 60m
        alertname: RAGRetrievalFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: rag
            exp_annotations:
              summary: "Knowledge searches are failing"
              description: >-
                More than a fifth of knowledge searches could not be completed, so agents are answering without the company's documents. Check the knowledge.search_failed log for its stage: embedding means the provider (see EmbeddingProviderUnavailable), search means the database.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: a few failed documents among many published do not alert
    input_series:
      - series: 'wasla_rag_ingestion_outcomes_total{job="wasla-api", outcome="published"}'
        values: "0+5x300"
      - series: 'wasla_rag_ingestion_outcomes_total{job="wasla-api", outcome="failed"}'
        values: "0+1x300"
      - series: 'wasla_rag_ingestion_outcomes_total{job="wasla-api", outcome="retry_scheduled"}'
        values: "0+20x300"
    alert_rule_test:
      - eval_time: 120m
        alertname: RAGIngestionFailureRate
        exp_alerts: []

  - interval: 30s
    name: indexing that mostly fails alerts
    input_series:
      - series: 'wasla_rag_ingestion_outcomes_total{job="wasla-api", outcome="published"}'
        values: "0+1x300"
      - series: 'wasla_rag_ingestion_outcomes_total{job="wasla-api", outcome="exhausted"}'
        values: "0+3x300"
    alert_rule_test:
      - eval_time: 20m
        alertname: RAGIngestionFailureRate
        exp_alerts: []
      - eval_time: 120m
        alertname: RAGIngestionFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: rag
            exp_annotations:
              summary: "Most document indexing is failing"
              description: >-
                More than half of the indexing attempts that finished in the last half hour failed terminally. Run `python -m app.workers.queues failed-documents`: provider codes point at the key, the model or the provider; document_too_large and invalid_document are uploads to fix, not an incident.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: a claim renewed within its lease does not alert
    input_series:
      - series: 'wasla_oldest_processing_document_age_seconds{job="wasla-api"}'
        values: "0+30x18 0+30x18 0+30x18 0+30x18 0+30x18"
    alert_rule_test:
      - eval_time: 45m
        alertname: RAGDocumentsStuck
        exp_alerts: []

  - interval: 30s
    name: a claim nobody renews or reclaims alerts
    input_series:
      - series: 'wasla_oldest_processing_document_age_seconds{job="wasla-api"}'
        values: "0+30x200"
    alert_rule_test:
      - eval_time: 30m
        alertname: RAGDocumentsStuck
        exp_alerts: []
      - eval_time: 60m
        alertname: RAGDocumentsStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              component: rag
            exp_annotations:
              summary: "A document has been held by an indexing worker for over half an hour"
              description: >-
                An indexing claim has not been renewed for half an hour, so the worker that held it is gone and the recovery sweep has not handed it on. Check the ingestion_recovery loop (WorkerLoopNotBeating) and list the attempts with `python -m app.workers.queues unindexed-documents`.
              runbook: docs/RUNBOOK.md

  # -------------------------------------------------------- agent tool calls
  - interval: 30s
    name: ordinary refusals do not look like tool failures
    input_series:
      - series: 'wasla_agent_tool_executions_total{job="wasla-api", tool="record_lead_details", outcome="succeeded"}'
        values: "0+10x300"
      - series: 'wasla_agent_tool_executions_total{job="wasla-api", tool="record_lead_details", outcome="rejected"}'
        values: "0+5x300"
    alert_rule_test:
      - eval_time: 70m
        alertname: AgentToolFailures
        exp_alerts: []
      - eval_time: 70m
        alertname: AgentToolDenials
        exp_alerts: []

  - interval: 30s
    name: a sustained run of tool failures alerts
    input_series:
      - series: 'wasla_agent_tool_executions_total{job="wasla-api", tool="schedule_follow_up", outcome="succeeded"}'
        values: "0+1x300"
      - series: 'wasla_agent_tool_executions_total{job="wasla-api", tool="schedule_follow_up", outcome="failed"}'
        values: "0+1x300"
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentToolFailures
        exp_alerts: []
      - eval_time: 70m
        alertname: AgentToolFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ai
            exp_annotations:
              summary: "Agent tools are failing"
              description: >-
                More than a tenth of agent tool calls are ending in a failure rather than a refusal, so the model is being told its tools do not work and customers are getting answers composed without them. Group wasla_agent_tool_executions_total by tool to see which one, and read the agent.tool_crashed log for the exception class.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: a sustained run of denials alerts
    input_series:
      - series: 'wasla_agent_tool_executions_total{job="wasla-api", tool="search_knowledge", outcome="succeeded"}'
        values: "0+1x300"
      - series: 'wasla_agent_tool_executions_total{job="wasla-api", tool="search_knowledge", outcome="denied"}'
        values: "0+1x300"
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentToolDenials
        exp_alerts: []
      - eval_time: 70m
        alertname: AgentToolDenials
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ai
            exp_annotations:
              summary: "Agent tool calls are being denied"
              description: >-
                A quarter of agent tool calls are being refused for want of an enabled grant. Check whether a tool was revoked while agents still expect it, and read the agent.tool_not_granted log for the tool names being asked for; a name no agent was ever granted is worth reading the conversation for.
              runbook: docs/RUNBOOK.md

  # ================================================================== media
  - interval: 30s
    name: an owed media release fires when no agent worker takes it up and clears when one does
    input_series:
      - series: 'wasla_media_release_owed{job="wasla-api"}'
        values: "0+0x20 1+0x60 0+0x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: MediaReleaseOwed
        exp_alerts: []
      - eval_time: 20m
        alertname: MediaReleaseOwed
        # Owed for ten minutes: not yet the fifteen the rule waits.
        exp_alerts: []
      - eval_time: 35m
        alertname: MediaReleaseOwed
        exp_alerts:
          - exp_labels:
              severity: critical
              component: media
            exp_annotations:
              summary: "Replies owed after customer attachments are not being taken up"
              description: >-
                One or more conversations had every attachment finished and an agent turn owed, and no agent worker has taken that turn up. The media recovery sweep keeps republishing them; the reply is held until one is consumed. Check that Redis accepts writes (media_recovery.release_failed in the worker log) and that a worker runs the agent kind (WorkerLoopNotBeating).
              runbook: docs/RUNBOOK.md
      - eval_time: 50m
        alertname: MediaReleaseOwed
        exp_alerts: []
      - eval_time: 35m
        # The stranded-file alert reads a different gauge and stays silent.
        alertname: MediaStranded
        exp_alerts: []

  - interval: 30s
    name: stranded media fires when it persists and clears when the sweep finishes it
    input_series:
      - series: 'wasla_media_stranded{job="wasla-api"}'
        values: "0+0x20 2+0x60 0+0x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: MediaStranded
        exp_alerts: []
      - eval_time: 20m
        alertname: MediaStranded
        # Stranded for ten minutes: not yet the fifteen the rule waits.
        exp_alerts: []
      - eval_time: 35m
        alertname: MediaStranded
        exp_alerts:
          - exp_labels:
              severity: critical
              component: media
            exp_annotations:
              summary: "Customer attachments are stranded and their replies held"
              description: >-
                One or more inbound attachments have been unresolved for longer than any attempt can take, and the media recovery sweep has not finished them. Replies to those conversations are waiting. Check that a worker runs the media kind (WorkerLoopNotBeating) and look for media_recovery.sweep_failed in its logs.
              runbook: docs/RUNBOOK.md
      - eval_time: 50m
        alertname: MediaStranded
        exp_alerts: []

  - interval: 30s
    name: a burst of failed attachments fires, and decisions never do
    input_series:
      # Twenty files a minute read, then a Meta outage fails twenty a minute.
      - series: 'wasla_media_outcomes_total{job="wasla-api", outcome="ready"}'
        values: "0+10x180"
      - series: 'wasla_media_outcomes_total{job="wasla-api", outcome="download_failed"}'
        values: "0+0x40 0+10x140"
      # A steady stream of unsupported and oversized files: decisions.
      - series: 'wasla_media_outcomes_total{job="wasla-api", outcome="unsupported_type"}'
        values: "0+10x180"
    alert_rule_test:
      - eval_time: 19m
        alertname: MediaProcessingFailureSpike
        # Half the traffic is unsupported files and nothing is failing.
        exp_alerts: []
      - eval_time: 75m
        alertname: MediaProcessingFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              component: media
            exp_annotations:
              summary: "More than a quarter of customer attachments are failing"
              description: >-
                Attachments are ending FAILED rather than read. The outcome label says where: credential_* is a number's token, host_refused is a Meta host outside META_MEDIA_HOST_ROOTS, download_failed / timeout / rate_limited is Meta, provider_failed is the reading provider, storage_failed is the object store. Customers are still answered, with the file marked unreadable.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: one failed file on a quiet night does not page anybody
    input_series:
      - series: 'wasla_media_outcomes_total{job="wasla-api", outcome="download_failed"}'
        values: "0 1+0x120"
      - series: 'wasla_media_outcomes_total{job="wasla-api", outcome="unsupported_type"}'
        values: "0 1+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: MediaProcessingFailureSpike
        exp_alerts: []

  - interval: 1m
    name: purge deletes owed for hours fire, and a key in its grace does not
    input_series:
      # Fifteen minutes old and settled, then a store refusing for hours.
      - series: 'wasla_media_purge_deletes_oldest_age_seconds{job="wasla-api"}'
        values: "900 0+0x30 0+60x480"
    alert_rule_test:
      - eval_time: 20m
        alertname: MediaPurgeDeletesFailing
        exp_alerts: []
      - eval_time: 8h
        alertname: MediaPurgeDeletesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: retention
            exp_annotations:
              summary: "A purged workspace's files are still in the object store"
              description: >-
                Object deletes recorded by a workspace purge have been owed for more than six hours, so a purged customer's files are still in the bucket. The purge worker retries every five minutes; check its purge.object_delete_failed lines and the media store credentials. The keys are in media_purge_objects.
              runbook: docs/RUNBOOK.md

  - interval: 30s
    name: a transcription outage fires and clears
    input_series:
      - series: 'wasla_provider_requests_total{job="wasla-worker", provider="openai", operation="transcribe", outcome="success"}'
        values: "0+2x20 40+0x40 40+2x40"
      - series: 'wasla_provider_requests_total{job="wasla-worker", provider="openai", operation="transcribe", outcome="unavailable"}'
        values: "0+0x20 0+2x40 80+0x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: TranscriptionFailureRate
        exp_alerts: []
      - eval_time: 33m
        alertname: TranscriptionFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: media
            exp_annotations:
              summary: "Most voice-note transcriptions are failing"
              description: >-
                More than half of transcription calls are failing after their retries, so customers' voice notes are being answered as unreadable. Check the OpenAI key, quota and status, and the transcription.rejected / transcription.unreachable log lines.
              runbook: docs/RUNBOOK.md
      - eval_time: 59m
        alertname: TranscriptionFailureRate
        exp_alerts: []

  - interval: 5m
    name: a quarantined upload fires while one remains
    input_series:
      # Reconciliation adds the quarantined level every pass.
      - series: 'wasla_media_upload_reconciliation_total{job="wasla-worker", outcome="quarantined"}'
        values: "0+0x12 0+1x24"
      - series: 'wasla_media_upload_reconciliation_total{job="wasla-worker", outcome="finalized"}'
        values: "0+3x36"
    alert_rule_test:
      - eval_time: 55m
        alertname: MediaUploadQuarantined
        exp_alerts: []
      - eval_time: 90m
        alertname: MediaUploadQuarantined
        exp_alerts:
          - exp_labels:
              severity: critical
              component: media
            exp_annotations:
              summary: "An attachment object does not match what Wasla wrote"
              description: >-
                Upload reconciliation found an object whose size or hash differs from its intent, and quarantined it: it is neither served nor deleted. Somebody with bucket access, or a store fault, changed it. Find it with storage_state = 'mismatched' in message_media and follow the quarantine procedure in the runbook.
              runbook: docs/RUNBOOK.md
