# Alert rules for the lifecycle and security surface.
#
# Metrics existing is not monitoring. Until this file, `/metrics` served a
# correct Prometheus document that nothing scraped and nothing evaluated - the
# audit's finding, and the reason the account-security endpoints could return
# 500 for a fortnight without anybody being told.
#
# Every rule below is written against a metric the application already emits.
# Nothing here needs a new instrumentation point, and nothing fires on a label
# that could grow with the customer base: no tenant id, no user id, no email,
# no provider reference. `route` is a FastAPI path *template*, which is bounded
# by the number of routes.
#
# `for:` durations are deliberately not zero. A single 5xx during a deploy is
# not an incident, and a rule that pages on one teaches people to ignore the
# pager - which is the failure mode that makes alerting worse than none.

groups:
  - name: wasla-lifecycle
    interval: 30s
    rules:
      # ---------------------------------------------------------------- 5xx
      - alert: LifecycleEndpointErrors
        # The endpoints where a 500 means a security operation silently did not
        # happen: sessions that were not revoked, a password that was not
        # changed, an account that was not closed, a workspace that was not
        # suspended. AUTH-01 was exactly this signal, unwatched.
        #
        # The route list is explicit rather than a regex over `/auth/.*`,
        # because most of `/auth` failing is a different, louder problem and
        # this rule is about the quiet one.
        expr: |
          sum by (route) (
            rate(wasla_http_requests_total{status="5xx", route=~"/api/v1/auth/logout-all|/api/v1/auth/password|/api/v1/auth/password/set|/api/v1/auth/me|/api/v1/workspaces|/api/v1/workspace|/api/v1/workspace/ownership|/api/v1/platform/users/.*|/api/v1/platform/tenants/.*"}[5m])
          ) > 0
        for: 10m
        labels:
          severity: critical
          component: lifecycle
        annotations:
          summary: "Lifecycle endpoint {{ $labels.route }} is returning 5xx"
          description: >-
            A security or lifecycle operation is failing after the caller was
            authorised. The most likely causes are a database enum the code
            writes and the schema does not carry (see AUTH-01 and
            tests/integration/test_schema_parity.py), a migration that has not
            been applied, or a dependency that is down. Check the application
            logs for the request id and the exception.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------------- orphan check
      - alert: OrphanedWorkspace
        # A state invariant rather than an event: `wasla_orphaned_workspaces` is
        # counted at scrape time by a query, so this fires whatever produced the
        # state - including a path nobody instrumented, and including somebody's
        # SQL. An ACTIVE workspace with no owner cannot be administered by
        # anybody: inviting an owner, changing the plan and closing it are all
        # owner-only.
        expr: wasla_orphaned_workspaces > 0
        for: 15m
        labels:
          severity: critical
          component: tenancy
        annotations:
          summary: "{{ $value }} active workspace(s) have no owner"
          description: >-
            Platform deletion of a last owner is supposed to suspend the
            workspace automatically. A non-zero value here means that did not
            happen, or the state was produced another way. Identify the
            workspaces with the query in docs/RUNBOOK.md and repair ownership
            with POST /api/v1/platform/tenants/{id}/ownership.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------- lifecycle failures
      - alert: LifecycleOperationFailureRate
        # The ratio, not the count. A handful of conflicts is normal - people
        # do try to delete workspaces they do not own - and a *rate* of them is
        # a client bug or an attack. `error` is always abnormal.
        expr: |
          (
            sum(rate(wasla_lifecycle_operations_total{outcome!="success"}[15m]))
            /
            clamp_min(sum(rate(wasla_lifecycle_operations_total[15m])), 0.001)
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          component: lifecycle
        annotations:
          summary: "More than half of lifecycle operations are failing"
          description: >-
            Account and workspace lifecycle operations are mostly not
            succeeding. Check wasla_lifecycle_operations_total by operation to
            see which one, and the application logs for why.
          runbook: docs/RUNBOOK.md

      - alert: WorkspaceBillingWindDownFailing
        # Deleting a workspace cancels its subscription and revokes its saved
        # cards in the same transaction. A failure here means the deletion
        # rolled back - which is the safe direction, and still means a customer
        # cannot close their workspace.
        expr: |
          sum(rate(wasla_lifecycle_operations_total{operation="workspace_billing_wind_down", outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: critical
          component: billing
        annotations:
          summary: "Workspace deletion cannot wind down billing"
          description: >-
            Subscription cancellation or payment-method revocation is failing
            during workspace deletion. Deletions are rolling back rather than
            leaving a live subscription on a closed workspace, so no customer is
            being charged incorrectly - but they cannot close their workspace.
          runbook: docs/BILLING.md

      - alert: WorkspacePurgeFailing
        # The retention sweep. A purge that cannot run means data a customer
        # was told would be erased is not being erased, which is a commitment
        # being quietly missed rather than an outage anybody notices.
        expr: |
          sum(rate(wasla_lifecycle_operations_total{operation="workspace_purge", outcome="error"}[1h])) > 0
        for: 2h
        labels:
          severity: warning
          component: retention
        annotations:
          summary: "The workspace purge sweep is failing"
          description: >-
            Deleted workspaces past their retention window are not being
            erased. Check the purge worker's logs; the sweep is idempotent, so
            it is safe to let it retry once the cause is fixed.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------------ re-auth abuse
      - alert: ReauthenticationFailureSpike
        # Failed Google re-authentication in front of account deletion. A burst
        # is somebody trying to authorise a deletion they cannot prove they may
        # make - or a broken client, which is also worth knowing.
        expr: |
          sum(rate(wasla_lifecycle_operations_total{operation="account_reauth", outcome="conflict"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Google re-authentication is failing repeatedly"
          description: >-
            Re-authentication proofs are being refused - a mismatched Google
            subject, a replayed state, or a proof belonging to another account.
            Check the audit log for google_login_failed entries.
          runbook: docs/GOOGLE_OAUTH.md

  # ------------------------------------------------------------------------
  # Authentication security events.
  #
  # `wasla_auth_security_events_total` was defined, emitted and scraped for
  # three phases, and no rule referenced it (AUTH-06). That is the shape of
  # monitoring that reads as monitoring and detects nothing: the code goes to
  # considerable lengths to notice a replayed refresh token, and the noticing
  # reached a counter nobody was watching.
  #
  # Every label matched below comes from a module constant at the call site -
  # `event`, `outcome` and `reason` are all closed vocabularies - so nothing
  # here can grow a series per customer, per address or per account. That is
  # also why no rule groups by anything a person could be identified from: an
  # alert that named the account under attack would put an email address in a
  # chat channel and in Alertmanager's API.
  - name: wasla-auth-security
    interval: 30s
    rules:
      # ------------------------------------------------------ refresh replay
      - alert: RefreshTokenReplayDetected
        # The highest-signal security event this system can produce. A refresh
        # token was presented after it had already been spent, which is either
        # a stolen token being used alongside the real one or a client that has
        # broken rotation - and the first is worth waking somebody for. The
        # application has already torn the account's sessions down by the time
        # this fires; what the alert adds is that a person finds out.
        #
        # No threshold, because one is the number that matters. `for: 2m` is
        # the shortest duration in this file and is about scrape settling
        # rather than about doubting the event: a counter increment is not a
        # blip, so waiting longer would only delay the page.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="refresh", outcome="blocked", reason="replay"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "A refresh token was replayed"
          description: >-
            A refresh token was presented twice. Wasla has already revoked the
            account's whole token family, so every session it held is dead and
            the person will be asked to sign in again. Establish which it was:
            audit_logs carries a refresh_token_reused row naming the account and
            the version it was raised to. Two causes are worth telling apart - a
            leaked token being used by somebody else, and a client that retries
            a refresh with the token it has already spent.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------------- login failures
      - alert: PasswordLoginFailureSpike
        # A rate, never a count. People mistype passwords, and a rule that
        # fired on one would be muted within a week. This threshold is roughly
        # twelve failures a minute sustained for a quarter of an hour - about
        # 180 refusals, which no honest traffic produces and which a spray
        # does immediately.
        #
        # Summed rather than split by `reason`, deliberately: an attacker
        # working through a list produces a mixture of invalid_credentials and
        # account_deleted, and a rule that watched each separately could let a
        # spray sit under both thresholds.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="login", outcome="failure"}[10m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Password logins are failing far above the normal rate"
          description: >-
            Sustained password-login failures. Most likely a credential-stuffing
            or spray attempt; a broken client that retries a bad credential in a
            loop looks the same from here and is also worth stopping. The
            per-account and per-address limits are already refusing the excess -
            check wasla_auth_security_events_total{event="rate_limit"} to see
            whether they are engaged, and the audit trail for login_failed rows
            to see which accounts are being named.
          runbook: docs/RUNBOOK.md

      # ---------------------------------------------------------- rate limits
      - alert: AuthenticationRateLimitSpike
        # Split by `reason` because the three mean genuinely different things -
        # `client` is one address being throttled, `account` is one account
        # being hammered from many, `account_reset` is the password-reset
        # budget - and an operator's first question is which. Three bounded
        # values, and Alertmanager groups by alertname and component, so the
        # worst case is one notification carrying three lines rather than three
        # notifications.
        expr: |
          sum by (reason) (
            rate(wasla_auth_security_events_total{event="rate_limit", outcome="blocked"}[10m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Authentication rate limiting is engaged ({{ $labels.reason }})"
          description: >-
            The authentication limiters are refusing traffic at a sustained
            rate. reason=client is a single caller being throttled; reason=account
            means one account's login budget is being spent, which is what a
            targeted attempt on a named person looks like; reason=account_reset
            is the password-reset budget, which bounds the reset endpoint's use
            as a mailbox-flooding tool. The limits are working - this says
            somebody is pushing against them.
          runbook: docs/RUNBOOK.md

      # -------------------------------------------------- email webhook forgery
      - alert: EmailWebhookSignatureFailures
        # A correctly configured provider signs every callback, so the honest
        # rate here is zero. Repeated refusals mean the shared secret has
        # drifted from the provider's - in which case delivery events are being
        # dropped and bounce handling has silently stopped - or that somebody
        # is posting to the endpoint to see what happens. Both are worth a
        # look; neither is worth a page.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="email_webhook", outcome="blocked", reason="invalid_signature"}[15m])
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Email webhook callbacks are failing signature verification"
          description: >-
            Repeated callbacks are being refused before they are parsed. Check
            that RESEND_WEBHOOK_SECRET matches the signing secret configured at
            the provider - a mismatch means delivery, bounce and complaint
            events are being discarded, so suppression will stop working while
            the endpoint keeps answering. If the secret is correct, this is
            unsigned traffic reaching the endpoint from somewhere else.
          runbook: docs/EMAIL.md

  - name: wasla-availability
    interval: 30s
    rules:
      - alert: ApplicationUnhandledErrors
        # Everything the handlers did not expect. Deliberately unlabelled at
        # source, so this is a single series and a single alert.
        expr: sum(rate(wasla_unhandled_errors_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "Unhandled exceptions are being raised"
          runbook: docs/RUNBOOK.md

      - alert: ScrapeTargetDown
        # The rule that makes every other rule mean something. Without it,
        # "no alerts firing" and "nothing being scraped" look identical - which
        # is the state this whole file was written to get out of.
        expr: up{job="wasla-api"} == 0
        for: 5m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Prometheus cannot scrape the Wasla API"
          description: >-
            No metrics are arriving, so no other alert in this file can fire.
            Treat a silent monitoring system as an incident in its own right.
          runbook: docs/RUNBOOK.md
