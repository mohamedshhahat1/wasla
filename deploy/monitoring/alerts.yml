# Alert rules for the lifecycle and security surface.
#
# Metrics existing is not monitoring. Until this file, `/metrics` served a
# correct Prometheus document that nothing scraped and nothing evaluated - the
# audit's finding, and the reason the account-security endpoints could return
# 500 for a fortnight without anybody being told.
#
# Every rule below is written against a metric the application already emits.
# Nothing here needs a new instrumentation point, and nothing fires on a label
# that could grow with the customer base: no tenant id, no user id, no email,
# no provider reference. `route` is a FastAPI path *template*, which is bounded
# by the number of routes.
#
# `for:` durations are deliberately not zero. A single 5xx during a deploy is
# not an incident, and a rule that pages on one teaches people to ignore the
# pager - which is the failure mode that makes alerting worse than none.

groups:
  - name: wasla-lifecycle
    interval: 30s
    rules:
      # ---------------------------------------------------------------- 5xx
      - alert: LifecycleEndpointErrors
        # The endpoints where a 500 means a security operation silently did not
        # happen: sessions that were not revoked, a password that was not
        # changed, an account that was not closed, a workspace that was not
        # suspended. AUTH-01 was exactly this signal, unwatched.
        #
        # The route list is explicit rather than a regex over `/auth/.*`,
        # because most of `/auth` failing is a different, louder problem and
        # this rule is about the quiet one.
        expr: |
          sum by (route) (
            rate(wasla_http_requests_total{status="5xx", route=~"/api/v1/auth/logout-all|/api/v1/auth/password|/api/v1/auth/password/set|/api/v1/auth/me|/api/v1/workspaces|/api/v1/workspace|/api/v1/workspace/ownership|/api/v1/platform/users/.*|/api/v1/platform/tenants/.*"}[5m])
          ) > 0
        for: 10m
        labels:
          severity: critical
          component: lifecycle
        annotations:
          summary: "Lifecycle endpoint {{ $labels.route }} is returning 5xx"
          description: >-
            A security or lifecycle operation is failing after the caller was
            authorised. The most likely causes are a database enum the code
            writes and the schema does not carry (see AUTH-01 and
            tests/integration/test_schema_parity.py), a migration that has not
            been applied, or a dependency that is down. Check the application
            logs for the request id and the exception.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------------- orphan check
      - alert: OrphanedWorkspace
        # A state invariant rather than an event: `wasla_orphaned_workspaces` is
        # counted at scrape time by a query, so this fires whatever produced the
        # state - including a path nobody instrumented, and including somebody's
        # SQL. An ACTIVE workspace with no owner cannot be administered by
        # anybody: inviting an owner, changing the plan and closing it are all
        # owner-only.
        expr: wasla_orphaned_workspaces > 0
        for: 15m
        labels:
          severity: critical
          component: tenancy
        annotations:
          summary: "{{ $value }} active workspace(s) have no owner"
          description: >-
            Platform deletion of a last owner is supposed to suspend the
            workspace automatically. A non-zero value here means that did not
            happen, or the state was produced another way. Identify the
            workspaces with the query in docs/RUNBOOK.md and repair ownership
            with POST /api/v1/platform/tenants/{id}/ownership.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------- lifecycle failures
      - alert: LifecycleOperationFailureRate
        # The ratio, not the count. A handful of conflicts is normal - people
        # do try to delete workspaces they do not own - and a *rate* of them is
        # a client bug or an attack. `error` is always abnormal.
        expr: |
          (
            sum(rate(wasla_lifecycle_operations_total{outcome!="success"}[15m]))
            /
            clamp_min(sum(rate(wasla_lifecycle_operations_total[15m])), 0.001)
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          component: lifecycle
        annotations:
          summary: "More than half of lifecycle operations are failing"
          description: >-
            Account and workspace lifecycle operations are mostly not
            succeeding. Check wasla_lifecycle_operations_total by operation to
            see which one, and the application logs for why.
          runbook: docs/RUNBOOK.md

      - alert: WorkspaceBillingWindDownFailing
        # Deleting a workspace cancels its subscription and revokes its saved
        # cards in the same transaction. A failure here means the deletion
        # rolled back - which is the safe direction, and still means a customer
        # cannot close their workspace.
        expr: |
          sum(rate(wasla_lifecycle_operations_total{operation="workspace_billing_wind_down", outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: critical
          component: billing
        annotations:
          summary: "Workspace deletion cannot wind down billing"
          description: >-
            Subscription cancellation or payment-method revocation is failing
            during workspace deletion. Deletions are rolling back rather than
            leaving a live subscription on a closed workspace, so no customer is
            being charged incorrectly - but they cannot close their workspace.
          runbook: docs/BILLING.md

      - alert: WorkspacePurgeFailing
        # The retention sweep. A purge that cannot run means data a customer
        # was told would be erased is not being erased, which is a commitment
        # being quietly missed rather than an outage anybody notices.
        expr: |
          sum(rate(wasla_lifecycle_operations_total{operation="workspace_purge", outcome="error"}[1h])) > 0
        for: 2h
        labels:
          severity: warning
          component: retention
        annotations:
          summary: "The workspace purge sweep is failing"
          description: >-
            Deleted workspaces past their retention window are not being
            erased. Check the purge worker's logs; the sweep is idempotent, so
            it is safe to let it retry once the cause is fixed.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------------ re-auth abuse
      - alert: ReauthenticationFailureSpike
        # Failed Google re-authentication in front of account deletion. A burst
        # is somebody trying to authorise a deletion they cannot prove they may
        # make - or a broken client, which is also worth knowing.
        expr: |
          sum(rate(wasla_lifecycle_operations_total{operation="account_reauth", outcome="conflict"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Google re-authentication is failing repeatedly"
          description: >-
            Re-authentication proofs are being refused - a mismatched Google
            subject, a replayed state, or a proof belonging to another account.
            Check the audit log for google_login_failed entries.
          runbook: docs/GOOGLE_OAUTH.md

  # ------------------------------------------------------------------------
  # Authentication security events.
  #
  # `wasla_auth_security_events_total` was defined, emitted and scraped for
  # three phases, and no rule referenced it (AUTH-06). That is the shape of
  # monitoring that reads as monitoring and detects nothing: the code goes to
  # considerable lengths to notice a replayed refresh token, and the noticing
  # reached a counter nobody was watching.
  #
  # Every label matched below comes from a module constant at the call site -
  # `event`, `outcome` and `reason` are all closed vocabularies - so nothing
  # here can grow a series per customer, per address or per account. That is
  # also why no rule groups by anything a person could be identified from: an
  # alert that named the account under attack would put an email address in a
  # chat channel and in Alertmanager's API.
  - name: wasla-auth-security
    interval: 30s
    rules:
      # ------------------------------------------------------ refresh replay
      - alert: RefreshTokenReplayDetected
        # The highest-signal security event this system can produce. A refresh
        # token was presented after it had already been spent, which is either
        # a stolen token being used alongside the real one or a client that has
        # broken rotation - and the first is worth waking somebody for. The
        # application has already torn the account's sessions down by the time
        # this fires; what the alert adds is that a person finds out.
        #
        # No threshold, because one is the number that matters. `for: 2m` is
        # the shortest duration in this file and is about scrape settling
        # rather than about doubting the event: a counter increment is not a
        # blip, so waiting longer would only delay the page.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="refresh", outcome="blocked", reason="replay"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "A refresh token was replayed"
          description: >-
            A refresh token was presented twice. Wasla has already revoked the
            account's whole token family, so every session it held is dead and
            the person will be asked to sign in again. Establish which it was:
            audit_logs carries a refresh_token_reused row naming the account and
            the version it was raised to. Two causes are worth telling apart - a
            leaked token being used by somebody else, and a client that retries
            a refresh with the token it has already spent.
          runbook: docs/RUNBOOK.md

      # ------------------------------------------------------- login failures
      - alert: PasswordLoginFailureSpike
        # A rate, never a count. People mistype passwords, and a rule that
        # fired on one would be muted within a week. This threshold is roughly
        # twelve failures a minute sustained for a quarter of an hour - about
        # 180 refusals, which no honest traffic produces and which a spray
        # does immediately.
        #
        # Summed rather than split by `reason`, deliberately: an attacker
        # working through a list produces a mixture of invalid_credentials and
        # account_deleted, and a rule that watched each separately could let a
        # spray sit under both thresholds.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="login", outcome="failure"}[10m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Password logins are failing far above the normal rate"
          description: >-
            Sustained password-login failures. Most likely a credential-stuffing
            or spray attempt; a broken client that retries a bad credential in a
            loop looks the same from here and is also worth stopping. The
            per-account and per-address limits are already refusing the excess -
            check wasla_auth_security_events_total{event="rate_limit"} to see
            whether they are engaged, and the audit trail for login_failed rows
            to see which accounts are being named.
          runbook: docs/RUNBOOK.md

      # ---------------------------------------------------------- rate limits
      - alert: AuthenticationRateLimitSpike
        # Split by `reason` because the three mean genuinely different things -
        # `client` is one address being throttled, `account` is one account
        # being hammered from many, `account_reset` is the password-reset
        # budget - and an operator's first question is which. Three bounded
        # values, and Alertmanager groups by alertname and component, so the
        # worst case is one notification carrying three lines rather than three
        # notifications.
        expr: |
          sum by (reason) (
            rate(wasla_auth_security_events_total{event="rate_limit", outcome="blocked"}[10m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Authentication rate limiting is engaged ({{ $labels.reason }})"
          description: >-
            The authentication limiters are refusing traffic at a sustained
            rate. reason=client is a single caller being throttled; reason=account
            means one account's login budget is being spent, which is what a
            targeted attempt on a named person looks like; reason=account_reset
            is the password-reset budget, which bounds the reset endpoint's use
            as a mailbox-flooding tool. The limits are working - this says
            somebody is pushing against them.
          runbook: docs/RUNBOOK.md

      # -------------------------------------------------- email webhook forgery
      - alert: EmailWebhookSignatureFailures
        # A correctly configured provider signs every callback, so the honest
        # rate here is zero. Repeated refusals mean the shared secret has
        # drifted from the provider's - in which case delivery events are being
        # dropped and bounce handling has silently stopped - or that somebody
        # is posting to the endpoint to see what happens. Both are worth a
        # look; neither is worth a page.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="email_webhook", outcome="blocked", reason="invalid_signature"}[15m])
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Email webhook callbacks are failing signature verification"
          description: >-
            Repeated callbacks are being refused before they are parsed. Check
            that RESEND_WEBHOOK_SECRET matches the signing secret configured at
            the provider - a mismatch means delivery, bounce and complaint
            events are being discarded, so suppression will stop working while
            the endpoint keeps answering. If the secret is correct, this is
            unsigned traffic reaching the endpoint from somewhere else.
          runbook: docs/EMAIL.md

  # ==========================================================================
  # Messaging.
  #
  # This whole group was missing. Twelve rules covered lifecycle, auth, billing
  # and the *email* webhook, and not one concerned WhatsApp - although every
  # metric below already existed and was already scraped. The asymmetry with
  # email is the clearest evidence it was an oversight rather than a decision
  # (MSG-12). Every failure the messaging audit reproduced was silent.
  #
  # Thresholds are deliberately not "greater than zero" where a healthy
  # deployment produces a trickle. A customer typing a message outside the
  # service window is a 4xx from Meta and is not an incident; a rule that fired
  # on it would be turned off within a week.
  - name: wasla-messaging
    interval: 30s
    rules:
      - alert: WhatsAppInboundStopped
        # The failure with no other symptom. If Meta disables the subscription,
        # or DNS moves, or the reverse proxy stops forwarding, everything looks
        # healthy from inside: no errors, no queue depth, no failed jobs, just
        # an inbox that quietly stops filling. Nothing else in this file can
        # detect it, because nothing is going wrong - things have stopped
        # happening.
        #
        # Guarded on the deployment having had traffic in the last day, so a
        # new or quiet deployment does not page on an empty night. That is the
        # honest version of "during business hours" for a product that does not
        # know its customers' hours.
        expr: |
          sum(rate(wasla_provider_requests_total{provider="whatsapp", operation="inbound_webhook"}[30m])) == 0
          and
          sum(increase(wasla_provider_requests_total{provider="whatsapp", operation="inbound_webhook"}[24h])) > 0
        for: 30m
        labels:
          severity: critical
          component: messaging
        annotations:
          summary: "No WhatsApp messages have arrived for 30 minutes"
          description: >-
            Inbound webhook deliveries have stopped, on a deployment that was
            receiving them today. Check that Meta has not disabled the
            subscription (App Dashboard, Webhooks), that the callback URL still
            resolves and still presents a valid certificate, and that the
            reverse proxy is forwarding POSTs to /api/v1/webhooks/whatsapp. A
            repeated 5xx or a repeated signature failure will make Meta disable
            the subscription, so check WhatsAppWebhookSignatureFailures too.
          runbook: docs/RUNBOOK.md

      - alert: WhatsAppWebhookSignatureFailures
        # Mirrors EmailWebhookSignatureFailures, on the same counter, for the
        # same reason - and with more at stake. A drifted app secret here does
        # not degrade a feature; it drops every customer message on the floor
        # with a 403 while the endpoint keeps answering, and enough of them
        # makes Meta disable the subscription for everybody.
        expr: |
          sum(
            rate(wasla_auth_security_events_total{event="whatsapp_webhook", outcome="blocked", reason="invalid_signature"}[15m])
          ) > 0.01
        for: 15m
        labels:
          severity: critical
          component: messaging
        annotations:
          summary: "WhatsApp webhook deliveries are failing signature verification"
          description: >-
            Deliveries are being refused before they are parsed. Check that
            META_APP_SECRET matches the app secret in Meta's App Dashboard - a
            mismatch means every customer message is being dropped with a 403,
            and Meta disables a subscription that keeps failing. If the secret
            is correct, this is unsigned traffic arriving from somewhere else.
          runbook: docs/WHATSAPP.md

      - alert: WhatsAppSendFailureRate
        # Sustained non-success on the send path. Ratio rather than a count, so
        # a workspace that sends a thousand messages an hour and a workspace
        # that sends ten are held to the same standard, and a single customer
        # mistake cannot trip it.
        expr: |
          sum(rate(wasla_provider_requests_total{provider="whatsapp", operation="send_message", outcome!="success"}[15m]))
          /
          clamp_min(sum(rate(wasla_provider_requests_total{provider="whatsapp", operation="send_message"}[15m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: warning
          component: messaging
        annotations:
          summary: "More than a fifth of WhatsApp sends are failing"
          description: >-
            Replies are not reaching customers. The usual causes are a revoked
            or expired access token (look for whatsapp.credential_refused), a
            template Meta has paused since it was last synced, or Meta itself
            being degraded. Note that an outcome of "unavailable" means the
            send may have been delivered anyway - see the unresolved-sends
            runbook before anybody retries anything by hand.
          runbook: docs/RUNBOOK.md

      - alert: WhatsAppRateLimited
        # Meta throttling an account. Not an error - the send path retries and
        # then records honestly - but it means messages are being delayed, and
        # sustained throttling usually means a campaign is configured to send
        # faster than the number's tier allows.
        expr: |
          sum(rate(wasla_provider_requests_total{provider="whatsapp", operation="send_message", outcome="rate_limited"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: messaging
        annotations:
          summary: "WhatsApp is rate limiting outbound sends"
          description: >-
            Meta is refusing sends with 429. Check whether a campaign's
            messages_per_minute exceeds what the number's tier allows, and
            whether the number's quality rating has dropped - Meta lowers the
            throughput limit when it does.
          runbook: docs/CAMPAIGNS.md

      - alert: UnprocessedInboundBacklog
        # Messages stored and never handed to a worker. Normally zero, because
        # the webhook queues the turn in the same request that stores the
        # message; a non-zero reading means Redis was unavailable when a
        # customer wrote in. InboundRecoveryWorker drains this on its own, so a
        # brief spike during a Redis restart is expected and the `for:` covers
        # it. A backlog that persists means recovery is not running.
        expr: wasla_unprocessed_inbound_events > 0
        for: 15m
        labels:
          severity: critical
          component: messaging
        annotations:
          summary: "Inbound WhatsApp messages are stored but unanswered"
          description: >-
            Customer messages were accepted and no worker was told to answer
            them. They are recoverable and not lost. Check that a worker
            process is running the inbound_recovery loop and that Redis is
            reachable from it; list the backlog with `python -m
            app.workers.queues unprocessed-inbound`.
          runbook: docs/RUNBOOK.md

      - alert: UnresolvedOutboundSends
        # Sends whose outcome Meta never confirmed. A few seconds' worth is
        # ordinary - a row is `requested` for the duration of the provider call
        # - so this fires on age rather than on existence. An hour means the
        # answer never came back, and those are exactly the rows that must not
        # be retried automatically.
        expr: wasla_oldest_unresolved_outbound_age_seconds > 3600
        for: 15m
        labels:
          severity: warning
          component: messaging
        annotations:
          summary: "A WhatsApp send has been unresolved for over an hour"
          description: >-
            One or more sends were committed, asked of Meta, and never
            confirmed, so it is unknown whether the customer received them.
            These are never retried automatically - a retry is the one action
            that can put a second copy on somebody's phone. List them with
            `python -m app.workers.queues unresolved-sends` and follow the
            unresolved-sends procedure in the runbook.
          runbook: docs/RUNBOOK.md

      - alert: QueueJobsStuck
        # The oldest job nobody has picked up. Covers every queue at once
        # rather than one rule per queue: the question an operator has is "are
        # workers keeping up", and the answer is the worst queue's answer.
        expr: max(wasla_queue_oldest_pending_age_seconds) > 900
        for: 10m
        labels:
          severity: warning
          component: messaging
        annotations:
          summary: "Queued work has been waiting over fifteen minutes"
          description: >-
            A job has sat unclaimed far longer than any of these should take.
            Either no worker is consuming that queue - check WORKER_KINDS and
            that the worker container is healthy - or the workers are saturated
            by a backlog. On the agent queue this is a customer waiting for a
            reply.
          runbook: docs/RUNBOOK.md

      - alert: DeadLetterGrowth
        # Jobs that stopped being retried. Any increase is worth a look,
        # because a dead-lettered agent turn is a customer who was never
        # answered and whose job will not be replayed without a person deciding
        # to (ADR-071).
        expr: sum(increase(wasla_queue_dead_letter_jobs[1h])) > 0
        for: 10m
        labels:
          severity: warning
          component: messaging
        annotations:
          summary: "Jobs are being dead-lettered"
          description: >-
            Work has stopped being retried and is waiting for a person.
            Inspect it with `python -m app.workers.queues dead-letters <queue>`.
            Replaying the agent queue is refused without --force on purpose: a
            turn that failed after the provider was engaged may already have
            sent the customer a reply.
          runbook: docs/RUNBOOK.md

  - name: wasla-workers
    interval: 30s
    rules:
      - alert: WorkerLoopNotBeating
        # The one metric that answers "is this loop running" directly, and until
        # now nothing consumed it. Workers serve no HTTP and are deliberately
        # not a scrape target (ADR-069), so `ScrapeTargetDown` - which watches
        # `up{job="wasla-api"}` - cannot see them: a worker container that is
        # absent entirely produced no `up == 0` anywhere, and every other rule
        # here fires on a *symptom*. `QueueJobsStuck` needs stuck work, so a
        # dead worker on a quiet queue stayed invisible until the first customer
        # message arrived and then waited fifteen minutes for the alert.
        #
        # The worst case is `recovery`: if it stops, the deployment has no crash
        # recovery at all, every other queue keeps draining normally, and
        # nothing fires until an unrelated backlog builds (WQ-05).
        #
        # `min by (kind)` because production runs two API replicas, each
        # rendering the same gauge from the same Redis keys, and one of them
        # briefly reading stale must not hide a kind that is genuinely gone.
        #
        # An absent series cannot make this silently disappear: the exposition
        # iterates the full worker inventory and publishes 0 for any kind that
        # has not beaten inside its expiry, so a kind that never started is a
        # zero rather than a gap.
        expr: min by (kind) (wasla_worker_heartbeat_alive) == 0
        for: 5m
        labels:
          severity: critical
          component: workers
        annotations:
          summary: "The {{ $labels.kind }} worker loop has stopped beating"
          description: >-
            A worker kind has not refreshed its liveness key inside its expiry,
            so either the worker container is not running, its event loop is
            blocked, or WORKER_KINDS no longer selects this loop. Nothing this
            kind is responsible for is being done. If it is `recovery`, the
            deployment currently has no crash recovery at all; if it is
            `inbound_recovery` or `ingestion_recovery`, work lost to a Redis
            outage is no longer being repaired. Check the worker container's
            health and logs.
          runbook: docs/RUNBOOK.md

      - alert: UnindexedDocumentBacklog
        # Documents somebody uploaded that no agent can search. Fires on age
        # rather than on existence, deliberately: a document is `pending` for
        # the few seconds between committing and being indexed, so a rule on
        # `> 0` would fire on every healthy upload and be turned off within a
        # week. Half an hour means the job never arrived - almost always a Redis
        # outage at upload time - and `IngestionRecoveryWorker` drains those on
        # its own, so this firing means recovery is not running either (WQ-03).
        expr: wasla_oldest_pending_document_age_seconds > 1800
        for: 15m
        labels:
          severity: warning
          component: workers
        annotations:
          summary: "An uploaded document has been unsearchable for over half an hour"
          description: >-
            A customer uploaded a document successfully and it is still not
            indexed, so no agent can answer from it. The content is not lost.
            List the backlog with `python -m app.workers.queues
            unindexed-documents`: a last error of `-` means the job never ran
            (check the ingestion and ingestion_recovery loops and Redis); a
            provider code means indexing is backing off after embedding
            failures (check EmbeddingProviderUnavailable).
          runbook: docs/RUNBOOK.md

  - name: wasla-availability
    interval: 30s
    rules:
      - alert: ApplicationUnhandledErrors
        # Everything the handlers did not expect. Deliberately unlabelled at
        # source, so this is a single series and a single alert.
        expr: sum(rate(wasla_unhandled_errors_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "Unhandled exceptions are being raised"
          runbook: docs/RUNBOOK.md

      - alert: ScrapeTargetDown
        # The rule that makes every other rule mean something. Without it,
        # "no alerts firing" and "nothing being scraped" look identical - which
        # is the state this whole file was written to get out of.
        expr: up{job="wasla-api"} == 0
        for: 5m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Prometheus cannot scrape the Wasla API"
          description: >-
            No metrics are arriving, so no other alert in this file can fire.
            Treat a silent monitoring system as an incident in its own right.
          runbook: docs/RUNBOOK.md

  # ==========================================================================
  # AI.
  #
  # Missing until the AI remediation (AI-09), and the gap was specific: a *hard*
  # provider outage was visible through DeadLetterGrowth, and a *degraded* one
  # was not. Throttling the retry absorbed, a classifier failing on every
  # message, turns stranded engaged, and a provider that began answering with
  # nothing all kept every rule in this file green.
  #
  # Every label matched below is a closed vocabulary: `operation` is one of
  # three client constants and `outcome` either the four-value provider domain or
  # `TurnOutcome`. Nothing identifies a workspace or a customer.
  - name: wasla-ai
    interval: 30s
    rules:
      - alert: OpenAIRequestFailureRate
        # The final outcome of each call, after its retries - what an agent turn
        # or a sentiment reading actually experienced. Ratio, so a quiet night
        # and a busy afternoon are held to one standard.
        expr: |
          sum(rate(wasla_provider_requests_total{provider="openai", operation=~"respond_.*", outcome!="success"}[15m]))
          /
          clamp_min(sum(rate(wasla_provider_requests_total{provider="openai", operation=~"respond_.*"}[15m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "More than a fifth of AI provider calls are failing"
          description: >-
            Agent turns and sentiment readings are failing after their retries.
            Check wasla_provider_requests_total by operation to see whether it is
            respond_agent, respond_sentiment or respond_vision, and the worker
            logs for openai.request_failed with its status and provider code. A
            401 or 403 is the API key; a 5xx is the provider.
          runbook: docs/RUNBOOK.md

      - alert: OpenAIRateLimited
        # Attempts, not calls. A 429 the retry absorbed is still a customer
        # waiting longer for a reply, and it never appears in the counter above.
        expr: |
          sum(rate(wasla_provider_attempts_total{provider="openai", operation=~"respond_.*", outcome="rate_limited"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "OpenAI is rate limiting this deployment"
          description: >-
            Provider attempts are being refused with 429 at a sustained rate,
            whether or not the retries eventually succeed, so customers are
            waiting longer for replies. Check the account's request and token
            limits with the provider and whether traffic has outgrown them.
          runbook: docs/RUNBOOK.md

      - alert: OpenAIUnavailable
        # Transport failures and 5xx, per attempt. Critical rather than warning:
        # a turn that exhausts its retries after engaging is stranded and its
        # customer is not answered by anything.
        expr: |
          sum(rate(wasla_provider_attempts_total{provider="openai", operation=~"respond_.*", outcome="unavailable"}[10m])) > 0.05
        for: 10m
        labels:
          severity: critical
          component: ai
        annotations:
          summary: "OpenAI is unreachable or failing with server errors"
          description: >-
            Provider attempts are failing with transport errors or 5xx responses.
            Agent turns that exhaust their retries are left engaged and are not
            retried, so their customers are not being answered. Check the
            provider's status and this deployment's egress to api.openai.com.
          runbook: docs/RUNBOOK.md

      - alert: AgentTurnsStranded
        # A state invariant rather than an event, counted at scrape time: turns
        # engaged longer than any healthy turn takes. Fires whatever stranded
        # them - an outage, an exception, a killed worker.
        expr: max(wasla_agent_turns_engaged_unfinished) > 0
        for: 15m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "Agent turns engaged a provider and never finished"
          description: >-
            At least one customer message had an agent turn engaged more than
            fifteen minutes ago that never finished, so it was not answered and
            will not be retried automatically. List the turns with the query in
            the runbook, read each conversation and answer by hand; do not replay
            the job, because a reply may already have been sent.
          runbook: docs/RUNBOOK.md

      - alert: AgentEmptyResponses
        # The provider answering with nothing. Each one is already handled - the
        # customer is told a colleague will follow up and a colleague is asked
        # to - but a sustained rate means the provider changed or a model is
        # refusing, and every AI reply is being replaced by a holding message.
        expr: |
          sum(rate(wasla_agent_turn_outcomes_total{outcome="empty_response"}[30m])) > 0.01
        for: 30m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "The AI is producing empty answers"
          description: >-
            Agent turns are ending with no words from the provider, so customers
            are being sent a holding message and handed to a colleague. A
            sustained rate usually means the provider changed its response shape
            or a model is refusing; check the agent.empty_response log.
          runbook: docs/RUNBOOK.md

      - alert: AgentToolFailures
        # Tool calls that *broke* - a handler raised and its work was rolled
        # back - as a share of everything the executor ran. Refusals are
        # excluded deliberately: a model asking for a tool it was not granted,
        # or naming a field that does not exist, is ordinary and is the system
        # working. A failure is not.
        #
        # A ratio rather than a rate, so a quiet workspace and a busy one alert
        # at the same badness, and `for: 30m` so one bad minute is not a page.
        expr: |
          sum(rate(wasla_agent_tool_executions_total{outcome="failed"}[30m]))
          /
          clamp_min(sum(rate(wasla_agent_tool_executions_total[30m])), 0.001)
          > 0.1
        for: 30m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "Agent tools are failing"
          description: >-
            More than a tenth of agent tool calls are ending in a failure rather
            than a refusal, so the model is being told its tools do not work and
            customers are getting answers composed without them. Group
            wasla_agent_tool_executions_total by tool to see which one, and read
            the agent.tool_crashed log for the exception class.
          runbook: docs/RUNBOOK.md

      - alert: AgentToolDenials
        # Calls refused because the agent holds no enabled grant for the tool.
        # A handful is normal - a model reaching for something it was never
        # offered is a thing models do, and the executor refuses it safely - but
        # a sustained share means either a capability was revoked while agents
        # are still configured to use it, or a conversation is talking a model
        # into naming tools it does not have.
        expr: |
          sum(rate(wasla_agent_tool_executions_total{outcome="denied"}[30m]))
          /
          clamp_min(sum(rate(wasla_agent_tool_executions_total[30m])), 0.001)
          > 0.25
        for: 30m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "Agent tool calls are being denied"
          description: >-
            A quarter of agent tool calls are being refused for want of an
            enabled grant. Check whether a tool was revoked while agents still
            expect it, and read the agent.tool_not_granted log for the tool
            names being asked for; a name no agent was ever granted is worth
            reading the conversation for.
          runbook: docs/RUNBOOK.md

  # ================================================================== RAG
  # Knowledge indexing and knowledge search (docs/RAG.md, RAG-05). Before these,
  # a rejected embedding key and a total query-embedding outage were both
  # invisible: every agent said it had no information, with every alert green.
  - name: wasla-rag
    interval: 30s
    rules:
      - alert: EmbeddingProviderUnavailable
        # Final outcomes of embedding calls, for indexing and for searches
        # alike. A ratio, and deliberately including refusals: a revoked key or
        # a model name that does not exist fails every call, and that is exactly
        # the outage that used to look like "nothing indexed yet".
        expr: |
          sum(rate(wasla_provider_requests_total{provider="openai", operation=~"embed_.*", outcome!="success"}[15m]))
          /
          clamp_min(sum(rate(wasla_provider_requests_total{provider="openai", operation=~"embed_.*"}[15m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: critical
          component: rag
        annotations:
          summary: "Embedding calls are failing"
          description: >-
            More than a fifth of embedding calls are failing after their retries,
            so documents are not being indexed and knowledge searches are
            answering without the knowledge base. Split
            wasla_provider_requests_total by operation (embed_ingest,
            embed_query) and outcome: failure is a refusal - check the API key
            and OPENAI_EMBEDDING_MODEL, and `python -m app.workers.queues
            failed-documents` for the code - while unavailable is the provider.
          runbook: docs/RUNBOOK.md

      - alert: EmbeddingRateLimited
        # Attempts, not calls: a 429 the retry absorbed still slowed an upload
        # or a customer's answer.
        expr: |
          sum(rate(wasla_provider_attempts_total{provider="openai", operation=~"embed_.*", outcome="rate_limited"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "OpenAI is rate limiting embedding calls"
          description: >-
            Embedding attempts are being refused with 429 at a sustained rate.
            Indexing backs off and retries, and searches wait longer; check the
            account's embedding limits and whether a bulk upload or a
            stale-embedding re-index is running.
          runbook: docs/RUNBOOK.md

      - alert: RAGRetrievalFailureRate
        # Searches that could not be completed. The customer's turn continues
        # without the knowledge base (RAG-03), which is why this has to be an
        # alert: nothing a customer sees is broken, the answers are just worse.
        expr: |
          sum(rate(wasla_rag_retrievals_total{outcome="failed"}[15m]))
          /
          clamp_min(sum(rate(wasla_rag_retrievals_total[15m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "Knowledge searches are failing"
          description: >-
            More than a fifth of knowledge searches could not be completed, so
            agents are answering without the company's documents. Check the
            knowledge.search_failed log for its stage: embedding means the
            provider (see EmbeddingProviderUnavailable), search means the
            database.
          runbook: docs/RUNBOOK.md

      - alert: RAGIngestionFailureRate
        # Indexing jobs that ended terminally, against those that ended at all.
        # Retries in progress are neither.
        expr: |
          sum(rate(wasla_rag_ingestion_outcomes_total{outcome=~"failed|exhausted"}[30m]))
          /
          clamp_min(sum(rate(wasla_rag_ingestion_outcomes_total{outcome=~"published|failed|exhausted"}[30m])), 0.001)
          > 0.5
        for: 30m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "Most document indexing is failing"
          description: >-
            More than half of the indexing attempts that finished in the last
            half hour failed terminally. Run `python -m app.workers.queues
            failed-documents`: provider codes point at the key, the model or the
            provider; document_too_large and invalid_document are uploads to
            fix, not an incident.
          runbook: docs/RUNBOOK.md

      - alert: RAGDocumentsStuck
        # A claim is renewed before every embedding batch and lapses after ten
        # minutes, and the recovery sweep then hands it on. Held for half an
        # hour means the worker holding it is gone and nothing reclaimed it.
        expr: max(wasla_oldest_processing_document_age_seconds) > 1800
        for: 10m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "A document has been held by an indexing worker for over half an hour"
          description: >-
            An indexing claim has not been renewed for half an hour, so the
            worker that held it is gone and the recovery sweep has not handed it
            on. Check the ingestion_recovery loop (WorkerLoopNotBeating) and list
            the attempts with `python -m app.workers.queues
            unindexed-documents`.
          runbook: docs/RUNBOOK.md

  # ------------------------------------------------------------------ media
  # Inbound attachments (MEDIA-15). Every rule reads a closed-label counter or
  # an unlabelled gauge: no workspace, file, key or URL. None fires on a single
  # unsupported or oversized file - those are decisions, not failures, and are
  # excluded from the failure ratio below.
  - name: wasla-media
    interval: 30s
    rules:
      - alert: MediaStranded
        # Unresolved past the longest an attempt or a queued job can take. The
        # recovery sweep finishes these every minute, so one that persists
        # means the sweep is not running or cannot finish - and each is a
        # conversation whose reply is held (MEDIA-03).
        expr: max(wasla_media_stranded) > 0
        for: 15m
        labels:
          severity: critical
          component: media
        annotations:
          summary: "Customer attachments are stranded and their replies held"
          description: >-
            One or more inbound attachments have been unresolved for longer
            than any attempt can take, and the media recovery sweep has not
            finished them. Replies to those conversations are waiting. Check
            that a worker runs the media kind (WorkerLoopNotBeating) and look
            for media_recovery.sweep_failed in its logs.
          runbook: docs/RUNBOOK.md

      - alert: MediaReleaseOwed
        # Every file is final and the agent turn is recorded as owed, but no
        # agent worker has taken it up within the release horizon. The media
        # recovery sweep republishes these every minute, so one that persists
        # is a queue still refusing the job or no agent worker consuming it.
        # Measured from the release, so republishing into a refusing Redis
        # does not reset it.
        expr: max(wasla_media_release_owed) > 0
        for: 15m
        labels:
          severity: critical
          component: media
        annotations:
          summary: "Replies owed after customer attachments are not being taken up"
          description: >-
            One or more conversations had every attachment finished and an
            agent turn owed, and no agent worker has taken that turn up. The
            media recovery sweep keeps republishing them; the reply is held
            until one is consumed. Check that Redis accepts writes
            (media_recovery.release_failed in the worker log) and that a worker
            runs the agent kind (WorkerLoopNotBeating).
          runbook: docs/RUNBOOK.md

      - alert: MediaProcessingFailureSpike
        # Attachments that ended because something broke, against all that
        # ended. Decisions - oversize, unsupported, unreadable, a suspended
        # workspace - are neither numerator nor alarm. A floor on volume keeps
        # a single failed file on a quiet night from paging anybody.
        expr: |
          (
            sum(rate(wasla_media_outcomes_total{outcome=~"download_failed|timeout|rate_limited|credential_refused|credential_unavailable|host_refused|malformed_descriptor|storage_failed|upload_conflict|provider_failed|reader_failed|abandoned"}[30m]))
            /
            clamp_min(sum(rate(wasla_media_outcomes_total[30m])), 0.001)
          ) > 0.25
          and
          sum(increase(wasla_media_outcomes_total{outcome=~"download_failed|timeout|rate_limited|credential_refused|credential_unavailable|host_refused|malformed_descriptor|storage_failed|upload_conflict|provider_failed|reader_failed|abandoned"}[30m])) >= 5
        for: 15m
        labels:
          severity: warning
          component: media
        annotations:
          summary: "More than a quarter of customer attachments are failing"
          description: >-
            Attachments are ending FAILED rather than read. The outcome label
            says where: credential_* is a number's token, host_refused is a
            Meta host outside META_MEDIA_HOST_ROOTS, download_failed / timeout
            / rate_limited is Meta, provider_failed is the reading provider,
            storage_failed is the object store. Customers are still answered,
            with the file marked unreadable.
          runbook: docs/RUNBOOK.md

      - alert: MediaPurgeDeletesFailing
        # A purged workspace's files still owed a delete. A key in its
        # in-flight grace is owed for fifteen minutes; six hours means the
        # store is refusing deletes, and "deleted" does not yet mean "gone".
        expr: max(wasla_media_purge_deletes_oldest_age_seconds) > 21600
        for: 30m
        labels:
          severity: warning
          component: retention
        annotations:
          summary: "A purged workspace's files are still in the object store"
          description: >-
            Object deletes recorded by a workspace purge have been owed for
            more than six hours, so a purged customer's files are still in
            the bucket. The purge worker retries every five minutes; check its
            purge.object_delete_failed lines and the media store credentials.
            The keys are in media_purge_objects.
          runbook: docs/RUNBOOK.md

      - alert: TranscriptionFailureRate
        # Final outcome per recording, after the client's retries. Counted
        # nowhere before MEDIA-15, so an outage looked like voice notes that
        # happened to be unreadable.
        expr: |
          (
            sum(rate(wasla_provider_requests_total{provider="openai", operation="transcribe", outcome!="success"}[15m]))
            /
            clamp_min(sum(rate(wasla_provider_requests_total{provider="openai", operation="transcribe"}[15m])), 0.001)
          ) > 0.5
          and
          sum(increase(wasla_provider_requests_total{provider="openai", operation="transcribe", outcome!="success"}[15m])) >= 3
        for: 15m
        labels:
          severity: warning
          component: media
        annotations:
          summary: "Most voice-note transcriptions are failing"
          description: >-
            More than half of transcription calls are failing after their
            retries, so customers' voice notes are being answered as
            unreadable. Check the OpenAI key, quota and status, and the
            transcription.rejected / transcription.unreachable log lines.
          runbook: docs/RUNBOOK.md

      - alert: MediaUploadQuarantined
        # An object at a key Wasla owns whose contents are not what Wasla wrote.
        # The reconciler counts the quarantined level every pass, so any
        # increase means at least one is still there. docs/MEDIA.md has always
        # promised this alert; it did not exist.
        expr: sum(increase(wasla_media_upload_reconciliation_total{outcome="quarantined"}[1h])) > 0
        for: 5m
        labels:
          severity: critical
          component: media
        annotations:
          summary: "An attachment object does not match what Wasla wrote"
          description: >-
            Upload reconciliation found an object whose size or hash differs
            from its intent, and quarantined it: it is neither served nor
            deleted. Somebody with bucket access, or a store fault, changed it.
            Find it with storage_state = 'mismatched' in message_media and
            follow the quarantine procedure in the runbook.
          runbook: docs/RUNBOOK.md
