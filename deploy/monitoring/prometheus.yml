# Prometheus configuration for a Wasla deployment.
#
# The scraper the metrics endpoint was written for and never had. `/metrics`
# has served a correct exposition document since ADR-070; nothing read it, so
# every counter in the application was a number in a file.
#
# **The target is the API container on the internal network, by name.** That is
# the same access control `/metrics` already relies on: `docker-compose.prod.yml`
# publishes no port for the API, and `nginx.conf` refuses `/metrics` on the
# public listener. Prometheus reaches it by being on that network, and nothing
# outside it can.

global:
  scrape_interval: 30s
  # Shorter than the scrape interval on purpose: a rule that takes longer to
  # evaluate than the data takes to arrive silently lags.
  evaluation_interval: 30s
  external_labels:
    # Which deployment an alert came from. A receiver shared between staging
    # and production without this is a receiver people learn to ignore.
    #
    # A literal, because **Prometheus does not expand environment variables in
    # this file** - the value would arrive at Alertmanager as the string
    # `${ENVIRONMENT}` and the inhibit rule that matches on it would silently
    # never match. A deployment overrides it by mounting its own copy of this
    # file, which is what `docker-compose.prod.yml` does with a bind mount.
    environment: production

# Relative to this file, so `promtool check config` works against the
# repository copy as well as against the mounted one.
rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: wasla-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # The API publishes queue depths and pool gauges read live at scrape time,
    # plus counters aggregated from Redis across every process. One target is
    # therefore the whole picture rather than one process's view of it.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
