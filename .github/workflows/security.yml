name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories are published without this repository changing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and audit tool
        # pip-audit inspects the environment it runs in, so the project and the
        # tool share one environment. The development extra is included on
        # purpose: build and test tooling is part of the supply chain that
        # produces the image.
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pip-audit

      - name: Audit dependencies for known vulnerabilities
        # --strict is omitted deliberately: the local wasla distribution is not
        # on PyPI and would be reported as unauditable. Real advisories still
        # fail this step.
        run: pip-audit --progress-spinner=off --desc

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A secret deleted in a later commit has still leaked.
          fetch-depth: 0

      - name: Scan repository history for secrets
        # Pinned image instead of a marketplace action: no licence key and a
        # deterministic version. --redact keeps findings out of the build log.
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose

  image:
    name: Container scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the runtime image
        # Built here rather than pulled: this workflow runs on pull requests,
        # where the image a change would produce has not been published and is
        # exactly the thing worth scanning.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: wasla:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wasla:scan
          format: table
          exit-code: "1"
          # Findings with no fix available are reported by the scheduled run
          # below but do not fail a pull request: there is nothing the author
          # of that change can do about a base-image CVE with no patch, and a
          # gate nobody can pass is a gate people learn to bypass.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Report everything, including what cannot be fixed
        # Never fails. Its job is visibility: an unfixable critical in the base
        # image is a reason to change base image, and that decision needs to be
        # visible somewhere before it becomes urgent.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wasla:scan
          format: table
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library
