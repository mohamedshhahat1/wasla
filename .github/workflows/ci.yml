name: CI

on:
  # Every branch, not only the default one. A push to a worktree branch used to
  # match nothing at all, which meant the gate below did not exist for any
  # branch without an open pull request.
  #
  # "**" rather than an omitted filter: it matches branch names containing
  # slashes, and it does not also fire on tag pushes. Tags are deploy.yml's
  # trigger and do not need a second run of these jobs.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed so a push and its pull request share one group. `github.ref` does not:
  # it reports refs/heads/x for the push and refs/pull/N/merge for the pull
  # request, so with the push filter above matching every branch, one commit
  # under review would start two full runs - two sets of service containers and
  # two image builds for one diff. `head_ref` is set only on pull_request and
  # holds the branch name, which is what `ref_name` holds on a push.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        # `app tests`, not `app`. The suite is where a call to an application
        # API lives, so a signature that changed under it is drift the tests
        # would otherwise keep passing over - which is exactly what a stub
        # service is for and exactly how one goes quietly out of date.
        run: mypy app tests

  tests:
    name: Tests and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_test
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment
      # The object store the media suites run against (ADR-077). Without these
      # they skip, and a skipped test proves nothing about a signature: SigV4
      # either satisfies a real store or it does not, and mocking a `boto` call
      # cannot tell the difference. These are the MinIO container's own
      # credentials, started in a step below, reachable from nowhere but this
      # runner - so they are fixtures, not secrets.
      TEST_S3_ENDPOINT_URL: http://localhost:9100
      TEST_S3_BUCKET: wasla-media
      TEST_S3_ACCESS_KEY_ID: wasla-media
      TEST_S3_SECRET_ACCESS_KEY: wasla-media-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start an object store for the media suites
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=wasla-media \
            -e MINIO_ROOT_PASSWORD=wasla-media-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9100/minio/health/live
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set ci http://localhost:9100 wasla-media wasla-media-secret && \
             mc mb --ignore-existing ci/wasla-media"

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      - name: No media suite was skipped for want of a store
        run: |
          # A skipped object-store test is indistinguishable from a passing one
          # in the summary, so the store being reachable is asserted rather than
          # assumed. Without this, a broken MinIO step would turn the whole
          # media suite into silent skips and CI would still be green.
          pytest tests/integration/test_object_store.py -q -rs 2>&1 | tee /tmp/store.txt
          if grep -q "No object store configured" /tmp/store.txt; then
            echo "::error::the object store was unreachable; media tests skipped"
            exit 1
          fi

      - name: Application starts
        run: python -c "from app.main import create_app; create_app(); print('application factory ok')"

      - name: Migrations apply, revert and reapply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No model drift against migrations
        run: alembic check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: wasla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves liveness
        run: |
          # Generated per run rather than written down. This container starts as
          # `staging`, which the settings validator now holds to the same signing
          # key rule as production - a committed value would both fail that check
          # and teach the wrong habit.
          RUN_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name wasla-ci -p 8000:8000 \
            -e ENVIRONMENT=staging \
            -e JWT_SECRET="$RUN_SECRET" \
            wasla:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              echo "liveness ok"
              docker rm -f wasla-ci
              exit 0
            fi
            sleep 2
          done
          echo "container did not become live" >&2
          docker logs wasla-ci
          docker rm -f wasla-ci
          exit 1
