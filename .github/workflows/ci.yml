name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        run: mypy app

  tests:
    name: Tests and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_test
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Application starts
        run: python -c "from app.main import create_app; create_app(); print('application factory ok')"

      - name: Migrations apply, revert and reapply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No model drift against migrations
        run: alembic check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: wasla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves liveness
        run: |
          # Generated per run rather than written down. This container starts as
          # `staging`, which the settings validator now holds to the same signing
          # key rule as production - a committed value would both fail that check
          # and teach the wrong habit.
          RUN_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name wasla-ci -p 8000:8000 \
            -e ENVIRONMENT=staging \
            -e JWT_SECRET="$RUN_SECRET" \
            wasla:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              echo "liveness ok"
              docker rm -f wasla-ci
              exit 0
            fi
            sleep 2
          done
          echo "container did not become live" >&2
          docker logs wasla-ci
          docker rm -f wasla-ci
          exit 1
