name: CI

on:
  # Every branch, not only the default one. A push to a worktree branch used to
  # match nothing at all, which meant the gate below did not exist for any
  # branch without an open pull request.
  #
  # "**" rather than an omitted filter: it matches branch names containing
  # slashes, and it does not also fire on tag pushes. Tags are deploy.yml's
  # trigger and do not need a second run of these jobs.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed so a push and its pull request share one group. `github.ref` does not:
  # it reports refs/heads/x for the push and refs/pull/N/merge for the pull
  # request, so with the push filter above matching every branch, one commit
  # under review would start two full runs - two sets of service containers and
  # two image builds for one diff. `head_ref` is set only on pull_request and
  # holds the branch name, which is what `ref_name` holds on a push.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # What the image installs (the Dockerfile's builder): the lock, by
        # hash, first; then the project and the dev-only tools, which leaves
        # every locked package at its pin. Resolving pyproject.toml afresh
        # tested whatever was newest that day - pypdf drifted CI red three
        # times that way (CPM-05, RGM-07).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Installed packages are the lock's
        run: |
          python -m scripts.check_installed_lock requirements.lock requirements-build.lock requirements-dev.lock
          pip check

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        # `app tests`, not `app`. The suite is where a call to an application
        # API lives, so a signature that changed under it is drift the tests
        # would otherwise keep passing over - which is exactly what a stub
        # service is for and exactly how one goes quietly out of date.
        run: mypy app tests

  tests:
    name: Tests, model-built schema (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest

    # One pytest process ran this whole suite for 62 minutes, and that one step
    # was the workflow's wall time. It is now split by file across the shards
    # below (`scripts/ci_shards.py`, balanced by the durations in
    # `scripts/ci_test_durations.json`). Each shard is a complete, separate
    # session with its own PostgreSQL, Redis and object store, and runs the
    # same gates on its own output the single run did. Nothing is deselected
    # or skipped that was not before, and the `coverage` job proves every test
    # the unsharded run would have collected ran in exactly one shard.
    #
    # `fail-fast: false`: a red shard should not cancel the others, or the
    # next run is the first to say what else was broken.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_test
      # The database-backed suites take no variable but this one, by design:
      # they begin by dropping the public schema of whatever they are given,
      # and `DATABASE_URL` is usually a database something is running against.
      # Here both name the same throwaway service container, deliberately.
      TEST_DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_test
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment
      # The object store the media suites run against (ADR-077). Without these
      # they skip, and a skipped test proves nothing about a signature: SigV4
      # either satisfies a real store or it does not, and mocking a `boto` call
      # cannot tell the difference. These are the MinIO container's own
      # credentials, started in a step below, reachable from nowhere but this
      # runner - so they are fixtures, not secrets.
      TEST_S3_ENDPOINT_URL: http://localhost:9100
      TEST_S3_BUCKET: wasla-media
      TEST_S3_ACCESS_KEY_ID: wasla-media
      TEST_S3_SECRET_ACCESS_KEY: wasla-media-secret
      # A 2 MB tmpfs, mounted below, that `test_local_storage_cleanup.py`
      # fills until it is full to prove a failed write leaves nothing behind.
      # Without it that test skips, and the skip gate rightly refuses it.
      WASLA_TEST_TMPFS: /mnt/wasla-tmpfs

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # What the image installs (the Dockerfile's builder): the lock, by
        # hash, first; then the project and the dev-only tools, which leaves
        # every locked package at its pin. Resolving pyproject.toml afresh
        # tested whatever was newest that day - pypdf drifted CI red three
        # times that way (CPM-05, RGM-07).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Installed packages are the lock's
        run: |
          python -m scripts.check_installed_lock requirements.lock requirements-build.lock requirements-dev.lock
          pip check

      - name: Start an object store for the media suites
        # Exact mirrors of quay.io/minio/minio and quay.io/minio/mc at these
        # releases, published unchanged to GHCR once the upstream images
        # stopped being publicly pullable (quay.io answered 401, 2026-09-25).
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=wasla-media \
            -e MINIO_ROOT_PASSWORD=wasla-media-secret \
            ghcr.io/mohamedshhahat1/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9100/minio/health/live
          docker run --rm --network host --entrypoint sh ghcr.io/mohamedshhahat1/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set ci http://localhost:9100 wasla-media wasla-media-secret && \
             mc mb --ignore-existing ci/wasla-media"

      - name: A small filesystem for the storage cleanup test
        run: |
          sudo mkdir -p /mnt/wasla-tmpfs
          sudo mount -t tmpfs -o size=2m,mode=1777 tmpfs /mnt/wasla-tmpfs
          df -h /mnt/wasla-tmpfs

      - name: Tests
        shell: bash
        env:
          # Present only if the repository holds the secret; absent is the
          # normal case, and fine. What is not fine is nobody noticing which
          # tests that costs, which the step below settles.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Each shard's coverage data and JUnit report, combined and checked
          # by the `coverage` job. The term-missing report is printed there,
          # over every shard, rather than six partial ones here.
          COVERAGE_FILE: reports/model-${{ matrix.shard }}.coverage
        run: |
          set -o pipefail
          mkdir -p reports
          FILES=$(python -m scripts.ci_shards files --suite model \
            --shards ${{ strategy.job-total }} --index ${{ matrix.shard }})
          echo "Shard ${{ matrix.shard }} runs: $FILES"
          # The two non-vacuity checks below only mean something in a session
          # that kept the AI and tool suites' data. They run there - in the
          # migration-parity job, which asserts they did not skip - and are
          # deselected here rather than left to skip, so the gate below is
          # not asked to excuse anything.
          pytest --cov=app --cov-report= -rs \
            --junitxml=reports/model-${{ matrix.shard }}.xml \
            --deselect tests/integration/test_ai_invariants.py::test_a_kept_run_really_had_something_to_sweep \
            --deselect tests/integration/test_tool_invariants.py::test_a_kept_run_really_had_something_to_sweep \
            $FILES | tee /tmp/pytest.txt

      - name: Every skip is one somebody chose
        shell: bash
        run: |
          # "3552 passed, 11 skipped" and "3552 passed, 11 silently broken"
          # are the same line. The object-store guard below makes that argument
          # for one suite; this makes it for the whole run.
          #
          # Three reasons are allowed, and all three are written down. The
          # real-provider suite opts out when the repository has no OpenAI key,
          # because a key is a paid secret and a fork cannot have one. A
          # real-provider test skips when the model declined to call a tool,
          # which is a property of the model rather than of this code.
          #
          # And the schema-parity suite skips *in this job*, deliberately: this
          # job builds its schema from the models, and against a model-built
          # schema that suite can only pass tautologically - the enum types are
          # created from the same Python members it would be checking. It has
          # its own job (`migration-parity`) which builds the schema with
          # `alembic upgrade head` and asserts there that it did **not** skip,
          # so the exemption granted here cannot become a place for it to go
          # quietly missing.
          #
          # The old-pgvector guard (RV-03) needs a second, deliberately outdated
          # PostgreSQL; its supported-version half runs everywhere, the
          # refusal half where WASLA_TEST_OLD_PGVECTOR_URL names one.
          #
          # Any other skip - a fixture that started returning None, a marker
          # added to get a red build green - fails here rather than blending
          # into a count.
          UNEXPECTED=$(grep -E "^SKIPPED" /tmp/pytest.txt             | grep -vE "real-provider tests are opt-in|the model declined to call a tool|schema parity is only meaningful against a migration-built database|the old-pgvector lane is opt-in" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::a test skipped for a reason nobody chose"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "Skips in this run, all accounted for:"
          grep -E "^SKIPPED" /tmp/pytest.txt || echo "  (none)"

      - name: No media suite was skipped for want of a store
        run: |
          # A skipped object-store test is indistinguishable from a passing one
          # in the summary, so the store being reachable is asserted rather than
          # assumed. Without this, a broken MinIO step would turn the whole
          # media suite into silent skips and CI would still be green.
          pytest tests/integration/test_object_store.py -q -rs 2>&1 | tee /tmp/store.txt
          if grep -q "No object store configured" /tmp/store.txt; then
            echo "::error::the object store was unreachable; media tests skipped"
            exit 1
          fi

      - name: Keep this shard's coverage and report
        # `always()` for the JUnit report: a red shard's timings are still
        # timings. The `coverage` job only runs when every shard passed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-model-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  migrations:
    name: Migrations and startup
    runs-on: ubuntu-latest

    # Ran at the end of the single test job, on the database its session had
    # just dropped. A fresh database is the same starting point, and as a job
    # of its own it no longer waits an hour for the suite to finish.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_test
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The lock by hash, then the project and its dev tools (CPM-05, RGM-07).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Installed packages are the lock's
        run: |
          python -m scripts.check_installed_lock requirements.lock requirements-build.lock requirements-dev.lock
          pip check

      - name: Application starts
        run: python -c "from app.main import create_app; create_app(); print('application factory ok')"

      - name: Migrations apply, revert and reapply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Every rule the migrations declare is enforced
        # `alembic upgrade` exiting 0 does not mean every constraint was
        # validated, every concurrent index finished and every trigger is on
        # (DB-027). The same check the `migrate` command runs after upgrading.
        run: python -m scripts.db_preflight verify

      - name: No model drift against migrations
        run: alembic check

  migration-suites:
    name: Integration and e2e, migration-built schema (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest

    # Every integration and end-to-end suite against the migrated schema.
    #
    # Was a hand-listed selection of twelve files, and the list is what went
    # wrong. It was chosen when AUTH-01 was the failure being prevented, so it
    # named the lifecycle endpoints and nothing else - and the entire billing
    # family, 210 tests, was never once executed against the plan catalogue a
    # deployment actually has. 166 of them failed the moment somebody tried it
    # (WQ-04).
    #
    # A list cannot be maintained against that: nobody adding a test thinks to
    # ask which CI job covers the schema production runs. So the scope is
    # "everything that touches a database", and a file added tomorrow is
    # covered by default rather than by remembering - `scripts/ci_shards.py`
    # places a file it has no timing for at the mean, and the `coverage` job
    # proves the shards together ran exactly what `pytest tests/integration
    # tests/e2e` collects.
    #
    # It was thirty-five minutes in one process; it is now split by file like
    # the model-built run. That is the price of the guarantee, and it is worth
    # paying: the model-built schema agrees with the models *by construction*,
    # so it is structurally incapable of catching a difference between the
    # models and the migrations. The kept-data sweep is not split: it sweeps
    # what earlier suites in its own session kept, so it stays one session, in
    # `migration-parity` below.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_migrations
      TEST_DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_migrations
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment
      # `alembic upgrade head` builds the schema, not the models (see
      # `migration-parity` below for why that matters).
      WASLA_TEST_SCHEMA: migrations

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The lock by hash, then the project and its dev tools (CPM-05, RGM-07).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Installed packages are the lock's
        run: |
          python -m scripts.check_installed_lock requirements.lock requirements-build.lock requirements-dev.lock
          pip check

      - name: Every integration and end-to-end suite against the migrated schema
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          FILES=$(python -m scripts.ci_shards files --suite migrations \
            --shards ${{ strategy.job-total }} --index ${{ matrix.shard }})
          echo "Shard ${{ matrix.shard }} runs: $FILES"
          pytest -q -rs --junitxml=reports/migrations-${{ matrix.shard }}.xml \
            --deselect tests/integration/test_ai_invariants.py::test_a_kept_run_really_had_something_to_sweep \
            --deselect tests/integration/test_tool_invariants.py::test_a_kept_run_really_had_something_to_sweep \
            $FILES | tee /tmp/pytest.txt

      - name: Every skip is one somebody chose
        shell: bash
        run: |
          # This run had no skip gate while it was one step; it has one per
          # shard now, and it allows exactly what that run skipped. This job
          # has no object store and no small filesystem, so the media and
          # storage-cleanup suites skip here as they always have - they run,
          # and are gated, in the model-built `tests` shards. Anything else
          # that skips fails here instead of blending into a count.
          UNEXPECTED=$(grep -E "^SKIPPED" /tmp/pytest.txt | grep -vE "No object store configured|the old-pgvector lane is opt-in" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::a test skipped for a reason nobody chose"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "Skips in this shard, all accounted for:"
          grep -E "^SKIPPED" /tmp/pytest.txt || echo "  (none)"

      - name: Keep this shard's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-migrations-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  migration-parity:
    name: Migration-built schema
    runs-on: ubuntu-latest

    # The job that would have caught AUTH-01. The `tests` job above builds its
    # schema with `Base.metadata.create_all`, which derives every native enum
    # from the Python members - so a label that no migration ever added is
    # present anyway, and every test that writes one passes. Four `AuditAction`
    # values lived in Python and in no migration for several phases; six
    # account-security endpoints returned 500 with a full rollback in
    # production, and CI was green throughout.
    #
    # So this job builds the schema the way a deployment does, and runs a
    # parity check between `pg_enum` and the mapped `sa.Enum` definitions
    # against it, then the kept-data sweep. The suites themselves run against
    # the same migration-built schema in `migration-suites` above - because a
    # parity test proves the labels exist and only the endpoints prove they are
    # written where they need to be.
    #
    # `alembic check` does not close this and is not a substitute: it compares
    # tables, columns, indexes and constraints, and SQLAlchemy's autogenerate
    # comparators do not diff native enum labels at all. It passed for the whole
    # period AUTH-01 was live. `test_schema_parity.py` asserts that too, so the
    # day it starts comparing them, somebody is told.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_migrations
      TEST_DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_migrations
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment
      # The switch that makes this job different from `tests`: the fixture runs
      # `alembic upgrade head` against an empty schema instead of creating
      # tables from the models.
      WASLA_TEST_SCHEMA: migrations

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # What the image installs (the Dockerfile's builder): the lock, by
        # hash, first; then the project and the dev-only tools, which leaves
        # every locked package at its pin. Resolving pyproject.toml afresh
        # tested whatever was newest that day - pypdf drifted CI red three
        # times that way (CPM-05, RGM-07).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Installed packages are the lock's
        run: |
          python -m scripts.check_installed_lock requirements.lock requirements-build.lock requirements-dev.lock
          pip check

      - name: Model and database enums agree
        # Runs first and on its own, so a parity failure is legible as a parity
        # failure rather than as a dozen endpoint tests going red together.
        run: pytest tests/integration/test_schema_parity.py -q -rs

      - name: The parity suite was not skipped
        shell: bash
        run: |
          # `test_schema_parity.py` skips itself unless the schema came from
          # migrations, because against a model-built one it can only pass
          # tautologically. A skipped run of it is therefore indistinguishable
          # from a passing one in the summary, and would mean this whole job
          # proved nothing - so the skip is asserted against rather than
          # trusted.
          pytest tests/integration/test_schema_parity.py -q -rs 2>&1 | tee /tmp/parity.txt
          if grep -q "^SKIPPED" /tmp/parity.txt; then
            echo "::error::the schema-parity suite skipped; WASLA_TEST_SCHEMA is not taking effect"
            exit 1
          fi

      - name: AI and tool invariants over the data their suites kept
        # The sweeps the AI and tool audits specify: every suite built on the
        # AI harness runs with its data kept, then both invariant files run
        # last in the same session, so they sweep everything those suites did
        # and first prove there was something to sweep. Kept data would
        # disturb suites that assume a clean database, so this is its own
        # session rather than a flag on the whole run.
        shell: bash
        env:
          WASLA_TEST_KEEP_AI_DATA: "1"
        run: |
          set -o pipefail
          SUITES=$(grep -l "ai_harness" tests/integration/test_*.py | grep -v _invariants)
          pytest -q -rs $SUITES \
            tests/integration/test_ai_invariants.py \
            tests/integration/test_tool_invariants.py | tee /tmp/kept.txt
          if grep -q "^SKIPPED" /tmp/kept.txt; then
            echo "::error::a test skipped in the kept-data sweep"
            grep "^SKIPPED" /tmp/kept.txt
            exit 1
          fi

  monitoring:
    name: Alert rules and receivers
    runs-on: ubuntu-latest

    # Metrics that nothing scrapes are not monitoring, and rules nothing
    # evaluates are not alerting. This job checks the half that can be checked
    # without a chat webhook: the Prometheus config parses, the rules load, the
    # rules actually *fire* against synthetic series and clear on recovery, and
    # the Alertmanager config is valid.
    #
    # What it deliberately does not claim is delivery to a real receiver. That
    # needs a credential a fork cannot have, and asserting it here would be the
    # kind of claim this repository has been burned by. See docs/OBSERVABILITY.md.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prometheus configuration and rules load
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/cfg:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /cfg/prometheus.yml

      - name: Alert rules fire and clear
        # promtool's own unit-test runner. Each case drives synthetic series
        # past a rule's `for:` duration and asserts the alert appears, then
        # stops when the condition does.
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/cfg:ro" -w /cfg \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            test rules /cfg/tests/alerts_test.yml

      - name: Alertmanager configuration is valid
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /cfg/alertmanager.yml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: wasla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves liveness
        run: |
          # Generated per run rather than written down. This container starts as
          # `staging`, which the settings validator now holds to the same signing
          # key rule as production - a committed value would both fail that check
          # and teach the wrong habit.
          RUN_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name wasla-ci -p 8000:8000 \
            -e ENVIRONMENT=staging \
            -e JWT_SECRET="$RUN_SECRET" \
            wasla:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              echo "liveness ok"
              docker rm -f wasla-ci
              exit 0
            fi
            sleep 2
          done
          echo "container did not become live" >&2
          docker logs wasla-ci
          docker rm -f wasla-ci
          exit 1

  coverage:
    name: Coverage, and every test ran exactly once
    runs-on: ubuntu-latest
    # Only once every shard passed: a combined report over a red shard would be
    # a number about a run that did not happen.
    needs: [tests, migration-suites]

    env:
      # Collection imports the application and its settings, nothing more: no
      # database, Redis or store is reached by `--collect-only`.
      ENVIRONMENT: test
      LOG_FORMAT: json
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The lock by hash, then the project and its dev tools (CPM-05, RGM-07).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Installed packages are the lock's
        run: |
          python -m scripts.check_installed_lock requirements.lock requirements-build.lock requirements-dev.lock
          pip check

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-model-*
          path: shards/model
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-migrations-*
          path: shards/migrations
          merge-multiple: true

      - name: Every collected test ran in exactly one shard
        # Sharding must not be a way for a test to stop running. This collects
        # each suite exactly as the unsharded command would - same roots, same
        # deselections - and fails unless the shards' JUnit reports together
        # hold every one of those tests, once, and nothing else.
        run: |
          python -m scripts.ci_shards verify --suite model --reports shards/model -- \
            --deselect tests/integration/test_ai_invariants.py::test_a_kept_run_really_had_something_to_sweep \
            --deselect tests/integration/test_tool_invariants.py::test_a_kept_run_really_had_something_to_sweep
          python -m scripts.ci_shards verify --suite migrations --reports shards/migrations -- \
            --deselect tests/integration/test_ai_invariants.py::test_a_kept_run_really_had_something_to_sweep \
            --deselect tests/integration/test_tool_invariants.py::test_a_kept_run_really_had_something_to_sweep

      - name: Coverage over every model-built shard
        # What `--cov-report=term-missing` printed when this was one process:
        # the shards' data combined, then reported over `app` as a whole.
        run: |
          coverage combine shards/model/*.coverage
          coverage report -m
