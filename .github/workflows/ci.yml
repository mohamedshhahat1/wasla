name: CI

on:
  # Every branch, not only the default one. A push to a worktree branch used to
  # match nothing at all, which meant the gate below did not exist for any
  # branch without an open pull request.
  #
  # "**" rather than an omitted filter: it matches branch names containing
  # slashes, and it does not also fire on tag pushes. Tags are deploy.yml's
  # trigger and do not need a second run of these jobs.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed so a push and its pull request share one group. `github.ref` does not:
  # it reports refs/heads/x for the push and refs/pull/N/merge for the pull
  # request, so with the push filter above matching every branch, one commit
  # under review would start two full runs - two sets of service containers and
  # two image builds for one diff. `head_ref` is set only on pull_request and
  # holds the branch name, which is what `ref_name` holds on a push.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        # `app tests`, not `app`. The suite is where a call to an application
        # API lives, so a signature that changed under it is drift the tests
        # would otherwise keep passing over - which is exactly what a stub
        # service is for and exactly how one goes quietly out of date.
        run: mypy app tests

  tests:
    name: Tests and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_test
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment
      # The object store the media suites run against (ADR-077). Without these
      # they skip, and a skipped test proves nothing about a signature: SigV4
      # either satisfies a real store or it does not, and mocking a `boto` call
      # cannot tell the difference. These are the MinIO container's own
      # credentials, started in a step below, reachable from nowhere but this
      # runner - so they are fixtures, not secrets.
      TEST_S3_ENDPOINT_URL: http://localhost:9100
      TEST_S3_BUCKET: wasla-media
      TEST_S3_ACCESS_KEY_ID: wasla-media
      TEST_S3_SECRET_ACCESS_KEY: wasla-media-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start an object store for the media suites
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=wasla-media \
            -e MINIO_ROOT_PASSWORD=wasla-media-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9100/minio/health/live
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set ci http://localhost:9100 wasla-media wasla-media-secret && \
             mc mb --ignore-existing ci/wasla-media"

      - name: Tests
        shell: bash
        env:
          # Present only if the repository holds the secret; absent is the
          # normal case, and fine. What is not fine is nobody noticing which
          # tests that costs, which the step below settles.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          pytest --cov=app --cov-report=term-missing -rs | tee /tmp/pytest.txt

      - name: Every skip is one somebody chose
        shell: bash
        run: |
          # "3552 passed, 11 skipped" and "3552 passed, 11 silently broken"
          # are the same line. The object-store guard below makes that argument
          # for one suite; this makes it for the whole run.
          #
          # Three reasons are allowed, and all three are written down. The
          # real-provider suite opts out when the repository has no OpenAI key,
          # because a key is a paid secret and a fork cannot have one. A
          # real-provider test skips when the model declined to call a tool,
          # which is a property of the model rather than of this code.
          #
          # And the schema-parity suite skips *in this job*, deliberately: this
          # job builds its schema from the models, and against a model-built
          # schema that suite can only pass tautologically - the enum types are
          # created from the same Python members it would be checking. It has
          # its own job (`migration-parity`) which builds the schema with
          # `alembic upgrade head` and asserts there that it did **not** skip,
          # so the exemption granted here cannot become a place for it to go
          # quietly missing.
          #
          # Any other skip - a fixture that started returning None, a marker
          # added to get a red build green - fails here rather than blending
          # into a count.
          UNEXPECTED=$(grep -E "^SKIPPED" /tmp/pytest.txt             | grep -vE "real-provider tests are opt-in|the model declined to call a tool|schema parity is only meaningful against a migration-built database" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::a test skipped for a reason nobody chose"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "Skips in this run, all accounted for:"
          grep -E "^SKIPPED" /tmp/pytest.txt || echo "  (none)"

      - name: No media suite was skipped for want of a store
        run: |
          # A skipped object-store test is indistinguishable from a passing one
          # in the summary, so the store being reachable is asserted rather than
          # assumed. Without this, a broken MinIO step would turn the whole
          # media suite into silent skips and CI would still be green.
          pytest tests/integration/test_object_store.py -q -rs 2>&1 | tee /tmp/store.txt
          if grep -q "No object store configured" /tmp/store.txt; then
            echo "::error::the object store was unreachable; media tests skipped"
            exit 1
          fi

      - name: Application starts
        run: python -c "from app.main import create_app; create_app(); print('application factory ok')"

      - name: Migrations apply, revert and reapply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No model drift against migrations
        run: alembic check

  migration-parity:
    name: Migration-built schema
    runs-on: ubuntu-latest

    # The job that would have caught AUTH-01. The `tests` job above builds its
    # schema with `Base.metadata.create_all`, which derives every native enum
    # from the Python members - so a label that no migration ever added is
    # present anyway, and every test that writes one passes. Four `AuditAction`
    # values lived in Python and in no migration for several phases; six
    # account-security endpoints returned 500 with a full rollback in
    # production, and CI was green throughout.
    #
    # So this job builds the schema the way a deployment does, and runs two
    # things against it: a parity check between `pg_enum` and the mapped
    # `sa.Enum` definitions, and the lifecycle suites themselves - because a
    # parity test proves the labels exist and only the endpoints prove they are
    # written where they need to be.
    #
    # `alembic check` does not close this and is not a substitute: it compares
    # tables, columns, indexes and constraints, and SQLAlchemy's autogenerate
    # comparators do not diff native enum labels at all. It passed for the whole
    # period AUTH-01 was live. `test_schema_parity.py` asserts that too, so the
    # day it starts comparing them, somebody is told.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_migrations
      TEST_DATABASE_URL: postgresql+asyncpg://wasla:wasla@localhost:5432/wasla_migrations
      REDIS_URL: redis://localhost:6379/0
      # CI-only value. Never used by any deployed environment.
      JWT_SECRET: continuous-integration-secret-value-not-for-deployment
      # The switch that makes this job different from `tests`: the fixture runs
      # `alembic upgrade head` against an empty schema instead of creating
      # tables from the models.
      WASLA_TEST_SCHEMA: migrations

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Model and database enums agree
        # Runs first and on its own, so a parity failure is legible as a parity
        # failure rather than as a dozen endpoint tests going red together.
        run: pytest tests/integration/test_schema_parity.py -q -rs

      - name: The parity suite was not skipped
        shell: bash
        run: |
          # `test_schema_parity.py` skips itself unless the schema came from
          # migrations, because against a model-built one it can only pass
          # tautologically. A skipped run of it is therefore indistinguishable
          # from a passing one in the summary, and would mean this whole job
          # proved nothing - so the skip is asserted against rather than
          # trusted.
          pytest tests/integration/test_schema_parity.py -q -rs 2>&1 | tee /tmp/parity.txt
          if grep -q "^SKIPPED" /tmp/parity.txt; then
            echo "::error::the schema-parity suite skipped; WASLA_TEST_SCHEMA is not taking effect"
            exit 1
          fi

      - name: Every integration and end-to-end suite against the migrated schema
        # Was a hand-listed selection of twelve files, and the list is what went
        # wrong. It was chosen when AUTH-01 was the failure being prevented, so
        # it named the lifecycle endpoints and nothing else - and the entire
        # billing family, 210 tests, was never once executed against the plan
        # catalogue a deployment actually has. 166 of them failed the moment
        # somebody tried it (WQ-04).
        #
        # A list cannot be maintained against that: nobody adding a test thinks
        # to ask which CI job covers the schema production runs. So the scope is
        # now "everything that touches a database", and a file added tomorrow is
        # covered by default rather than by remembering.
        #
        # It costs about twenty minutes, in its own job, in parallel with the
        # model-built run. That is the price of the guarantee, and it is worth
        # paying: the model-built schema agrees with the models *by
        # construction*, so it is structurally incapable of catching a
        # difference between the models and the migrations.
        run: pytest -q -rs tests/integration tests/e2e

  monitoring:
    name: Alert rules and receivers
    runs-on: ubuntu-latest

    # Metrics that nothing scrapes are not monitoring, and rules nothing
    # evaluates are not alerting. This job checks the half that can be checked
    # without a chat webhook: the Prometheus config parses, the rules load, the
    # rules actually *fire* against synthetic series and clear on recovery, and
    # the Alertmanager config is valid.
    #
    # What it deliberately does not claim is delivery to a real receiver. That
    # needs a credential a fork cannot have, and asserting it here would be the
    # kind of claim this repository has been burned by. See docs/OBSERVABILITY.md.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prometheus configuration and rules load
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/cfg:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /cfg/prometheus.yml

      - name: Alert rules fire and clear
        # promtool's own unit-test runner. Each case drives synthetic series
        # past a rule's `for:` duration and asserts the alert appears, then
        # stops when the condition does.
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/cfg:ro" -w /cfg \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            test rules /cfg/tests/alerts_test.yml

      - name: Alertmanager configuration is valid
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /cfg/alertmanager.yml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: wasla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves liveness
        run: |
          # Generated per run rather than written down. This container starts as
          # `staging`, which the settings validator now holds to the same signing
          # key rule as production - a committed value would both fail that check
          # and teach the wrong habit.
          RUN_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name wasla-ci -p 8000:8000 \
            -e ENVIRONMENT=staging \
            -e JWT_SECRET="$RUN_SECRET" \
            wasla:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              echo "liveness ok"
              docker rm -f wasla-ci
              exit 0
            fi
            sleep 2
          done
          echo "container did not become live" >&2
          docker logs wasla-ci
          docker rm -f wasla-ci
          exit 1
