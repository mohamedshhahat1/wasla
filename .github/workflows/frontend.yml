name: Frontend

# The frontend's own workflow (FE-1, ADR-192; CI-01..CI-03). It runs only when the frontend,
# its contract export or this file changes; the backend workflows are not touched and do not
# run it. It deploys nothing and uses no secret.
on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No tool phones home from CI.
  DO_NOT_TRACK: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  # Every build here is the development table of packages/config/origins.js.
  WASLA_ENV: development

defaults:
  run:
    working-directory: frontend

jobs:
  install:
    name: Install (frozen lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: pnpm from packageManager (corepack)
        run: |
          corepack enable
          pnpm --version
      - name: pnpm store path
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Versions
        run: node --version && pnpm --version && pnpm exec turbo --version

  generate:
    name: Generated client is current (drift)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - run: corepack enable
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Regenerate schema.d.ts from the committed openapi.json
        run: pnpm exec turbo run generate
      - name: Fail on any difference (AC-02)
        run: git diff --exit-code -- packages/api-client/src/schema.d.ts

  checks:
    name: Typecheck, lint, test, i18n, build, audit
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - run: corepack enable
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Formatting
        run: pnpm run format:check
      - name: The pipeline (every app and package)
        run: pnpm exec turbo run typecheck lint test i18n:check build --continue
      - name: The Workers builds (OpenNext; built, not deployed)
        run: |
          pnpm --filter @wasla/web run build:worker
          pnpm --filter @wasla/console run build:worker
          du -sh apps/web/.open-next/worker.js apps/web/.open-next/assets apps/console/.open-next/worker.js || true
          # FX-01: the entry hashes, compared with scripts/build-workers-linux.mjs on a developer's machine.
          sha256sum apps/web/.open-next/worker.js apps/console/.open-next/worker.js
      - name: The Workers served by workerd (FEF-16; every page 200, session routes 405 / 503)
        run: node scripts/workers-smoke.mjs
      - name: Advisories in production dependencies (high / critical fail)
        run: pnpm audit --prod --audit-level high
      - name: Licences - direct (FX-05) and every package against licence-policy.json (FEF-06, ADR-195)
        run: node scripts/check-licences.mjs

  storybook:
    name: Storybook, axe per story, RTL keyboard
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - run: corepack enable
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Browsers
        run: pnpm --filter @wasla/ui exec playwright install --with-deps chromium firefox webkit
      - name: Build Storybook
        run: pnpm --filter @wasla/ui run storybook:build
      - name: axe on every story (en, ar) and the RTL keyboard proof (3 browsers)
        run: pnpm --filter @wasla/ui run storybook:test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-test-results
          path: frontend/packages/ui/test-results
          retention-days: 7

  # FE-3 (section 20): with the shell's journeys one job passed 40 minutes on the runner, so the
  # run is split by Playwright project - same profile, same build, same journeys, none dropped.
  # stream-restart restarts the API, so it runs in a job of its own (--no-deps: its dependency
  # list exists only to keep it after the browsers in a single local run).
  e2e:
    name: E2E against the backend profile (${{ matrix.part.name }})
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part:
          - id: chromium
            name: Chromium, desktop and phone
            browsers: chromium
            projects: --project=chromium-desktop --project=chromium-phone
          - id: firefox
            name: Firefox, desktop and phone
            browsers: firefox
            projects: --project=firefox-desktop --project=firefox-phone
          - id: webkit
            name: WebKit, desktop and phone
            browsers: webkit
            projects: --project=webkit-desktop --project=webkit-phone
          - id: visual-roles
            name: visual roles and the 60 / 30 / 10 check
            browsers: chromium
            projects: --project=visual-roles-desktop --project=visual-roles-phone
          - id: stream-restart
            name: stream restart
            browsers: chromium
            projects: --project=stream-restart --no-deps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - run: corepack enable
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Browsers
        run: pnpm --filter @wasla/e2e exec playwright install --with-deps ${{ matrix.part.browsers }}
      - name: Build, start FE-0's profile, run this part's projects (en/ar), down -v
        env:
          CI: "true"
          WASLA_VISUAL_DIR: ${{ github.workspace }}/frontend/e2e/visual-roles
          # FE-3 (VQ3-02): gate states are measured apart from the averages.
          WASLA_VISUAL_GATES_DIR: ${{ github.workspace }}/frontend/e2e/visual-gates
        run: node e2e/scripts/e2e-local.mjs -- ${{ matrix.part.projects }}
      - name: The 60 / 30 / 10 averages of every captured screen (VQ-03, ADR-195)
        if: matrix.part.id == 'visual-roles'
        run: node scripts/measure-colour-roles.mjs --check e2e/visual-roles
      - name: The profile is down whatever happened
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml --profile e2e down -v --remove-orphans
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.part.id }}
          path: frontend/e2e/playwright-report
          retention-days: 7
      - if: (failure() || cancelled()) && matrix.part.id == 'visual-roles'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-roles
          path: frontend/e2e/visual-roles
          retention-days: 7
      - if: (failure() || cancelled()) && matrix.part.id == 'visual-roles'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-gates
          path: frontend/e2e/visual-gates
          retention-days: 7
