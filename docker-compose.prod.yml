# Production stack.
#
# Every secret is interpolated from the deployment environment and required:
# compose fails fast rather than starting with an insecure default. Migrations
# run as a one-shot service so they are applied exactly once per release.
name: wasla-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker gives a container 64MB of /dev/shm, and PostgreSQL puts a
    # parallel query's shared tuple store there. An aggregate big enough to be
    # worth parallelising then dies with "could not resize shared memory
    # segment ... No space left on device", and the server restarts into
    # recovery - which is how this was found, by running a platform usage
    # roll-up over four million rows (ADR-081).
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: always

  redis:
    image: redis:7-alpine
    # A password, and it is required rather than optional.
    #
    # The network is private, which is the usual argument for leaving Redis
    # open, and it is not enough here because of *what this Redis holds*: the
    # spent-refresh-token denylist. Anything that can reach it can delete a key
    # and turn a revoked token back into a live one - undoing a logout, an
    # ADR-036 sign-out-everywhere, and the ADR-039 teardown that fires when a
    # leaked token is replayed. It also holds the agent queue, so write access
    # is enough to make a worker send WhatsApp messages of somebody's choosing.
    #
    # "Private network" means one compromised container, one misconfigured
    # `networks:` entry, or one sidecar somebody adds next quarter. The password
    # is one line and does not depend on that staying true.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticated, or the check passes while the server is refusing every
      # real client - which reads as "Redis is fine" during exactly the outage
      # a misconfigured password would cause.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      # For the healthcheck only. `redis-cli -a` on the command line would put
      # the password in the process list of every container that can read it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - internal
    restart: always

  migrate:
    image: ${WASLA_IMAGE:?WASLA_IMAGE is required}
    command: ["migrate"]
    # Container hardening. The image already runs as an unprivileged user
    # (Dockerfile: USER wasla, uid 1001); these bound what that user could do if
    # the process were taken over.
    #
    # `no-new-privileges` stops a setuid binary inside the image regaining
    # privilege - it is the one that makes dropping capabilities durable rather
    # than advisory. `cap_drop: ALL` is safe because nothing here binds a
    # privileged port: the application listens on 8000 and nginx is the only
    # thing in front of it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    image: ${WASLA_IMAGE:?WASLA_IMAGE is required}
    # Container hardening. The image already runs as an unprivileged user
    # (Dockerfile: USER wasla, uid 1001); these bound what that user could do if
    # the process were taken over.
    #
    # `no-new-privileges` stops a setuid binary inside the image regaining
    # privilege - it is the one that makes dropping capabilities durable rather
    # than advisory. `cap_drop: ALL` is safe because nothing here binds a
    # privileged port: the application listens on 8000 and nginx is the only
    # thing in front of it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # The interactive reference publishes every route and schema, platform
      # administration included. Stated here rather than left to the default,
      # and the production validator refuses to boot without it.
      DOCS_ENABLED: "false"
      # Which peers may speak for the client behind them. nginx on the compose
      # network is the only one; without this the application ignores every
      # forwarding header and rate-limits by the socket address, which behind a
      # proxy would be one bucket for the whole internet.
      # The nginx container's fixed address on the internal network below.
      # This is compared against the *peer* address of the connection, so it
      # has to be an address or a CIDR network - a service name never matches
      # one, which is what made the previous default silently disable both
      # forwarded-client identity and HSTS (ADR-060). The application refuses
      # to start on anything that is not one.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-10.89.0.10}
      LOG_FORMAT: json
      # Serves /metrics on the internal network. nginx refuses the path on the
      # public listener and this container publishes no port of its own, so the
      # exposition is reachable from a scraper on `internal` and from nowhere
      # else (ADR-070).
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # Distributed tracing (ADR-083). Off unless a deployment has a collector,
      # and refusing to start if it says otherwise without naming one. Both
      # processes get the same values: a trace that the API sampled in and the
      # worker sampled out is a trace missing its middle, which is the least
      # useful possible outcome of sampling.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Read-only, and only so `/metrics` can say how long it has been since a
      # backup last reached its destination. The API takes no backups and
      # holds no object-store credential (ADR-075).
      BACKUP_STATUS_PATH: /backups/status.json
      QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:-120}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET is required to verify webhook signatures}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      # --- Media storage (ADR-077) ---
      #
      # Both processes get the same values, and they must: the worker writes an
      # attachment and the API serves it back. A deployment where the two
      # disagreed would accept files into one store and read from another.
      #
      # `local` keeps the shared volume below and is a single-host arrangement.
      # `s3` is what removes that, and selecting it with an incomplete
      # configuration refuses to start rather than silently writing to disk.
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-26214400}
      # `${VAR:-}`, never `${VAR:?}`: a deployment that has not switched the
      # object store on must still come up, and the application's own validator
      # is what refuses a *half* configured one (ADR-062).
      #
      # Deliberately NOT the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY pair the
      # backup service holds. Media and backups are different buckets under
      # different credentials, so an application container that is taken over
      # cannot reach the copies of the database (ADR-075). The deployment drift
      # guard asserts both directions of that.
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
      MEDIA_S3_SERVER_SIDE_ENCRYPTION: ${MEDIA_S3_SERVER_SIDE_ENCRYPTION:-}
      MEDIA_S3_TIMEOUT_SECONDS: ${MEDIA_S3_TIMEOUT_SECONDS:-30}
      # Zero disables the retention sweep, which is the default: how long a
      # customer's attachments are kept is a decision this file cannot make
      # (ADR-078).
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-0}
      MEDIA_RETENTION_BATCH_SIZE: ${MEDIA_RETENTION_BATCH_SIZE:-200}
      MEDIA_RETENTION_POLL_SECONDS: ${MEDIA_RETENTION_POLL_SECONDS:-86400}
      MEDIA_UPLOAD_GRACE_SECONDS: ${MEDIA_UPLOAD_GRACE_SECONDS:-900}
      MEDIA_UPLOAD_RECOVERY_POLL_SECONDS: ${MEDIA_UPLOAD_RECOVERY_POLL_SECONDS:-300}
      MEDIA_UPLOAD_RECOVERY_BATCH_SIZE: ${MEDIA_UPLOAD_RECOVERY_BATCH_SIZE:-100}
      # A key ring for workspace credentials at rest (ADR-034). Optional, and
      # the consequence of leaving it empty is specific rather than vague: every
      # workspace sends through META_ACCESS_TOKEN, and a workspace trying to
      # store its own is refused rather than having it written in the clear.
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:-}
      DEFAULT_PLAN_CODE: ${DEFAULT_PLAN_CODE:-starter}
      # Limits default to sensible values in the application; they are exposed
      # here because the right number depends on the deployment, and finding out
      # that it does not during an incident is the wrong time.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_WORKSPACE_PER_MINUTE: ${RATE_LIMIT_WORKSPACE_PER_MINUTE:-300}
      RATE_LIMIT_CAMPAIGN_PER_MINUTE: ${RATE_LIMIT_CAMPAIGN_PER_MINUTE:-30}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-33554432}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      RUN_MIGRATIONS: "false"

      # --- Feature integrations (ADR-062) ---
      #
      # Every one of these is `${VAR:-}`, never `${VAR:?}`. A feature this
      # deployment has not switched on must not stop the stack coming up, and
      # each feature's own settings validator is what refuses a *half*
      # configured one - `EMAIL_ENABLED=true` with no sender, `GOOGLE_ENABLED=
      # true` with no client id, `BILLING_PROVIDER=paymob` with no HMAC secret.
      # Making them mandatory here would move that decision from the
      # application, which knows which combinations are coherent, to Compose,
      # which does not.
      #
      # Split by what each process actually reads. The API and the worker do
      # not need the same secrets, and handing each only what it uses is the
      # difference between one compromised container and two.

      # The canonical origin. Read by the API to build the Paymob callback URL
      # and by the worker to build emailed links - never derived from a request
      # header, because a reset link built from a Host header is one an
      # attacker can aim.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}

      # Email. The API *writes* outbox rows and verifies Resend's delivery
      # webhook; it never sends, so RESEND_API_KEY is deliberately absent here
      # and appears only on the worker.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Verifies the Svix signature on delivery events. The API owns that
      # endpoint, and without this it refuses every delivery rather than
      # trusting any - so this container is the only one that carries it, and
      # `require_delivery_verification` is what makes a production API with
      # email on refuse to start without it (ADR-063).
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-600}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}

      # Google sign-in. API only: no worker path touches OIDC, so the client
      # secret never reaches that container. With GOOGLE_ENABLED unset the
      # worker's settings do not even ask for the rest.
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}

      # Payments. The API creates the intention a customer is sent to and
      # verifies the callback that settles it; the worker collects renewals, so
      # both hold these.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
      PAYMOB_MOTO_INTEGRATION_ID: ${PAYMOB_MOTO_INTEGRATION_ID:-}
      # The credential the transaction-inquiry API takes, which is not the
      # secret key. Without it a collection attempt whose callback never
      # arrived cannot be resolved (ADR-088).
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_REGION: ${PAYMOB_REGION:-egypt}

      # Dunning (ADR-061). Only the billing worker acts on these, and they are
      # here as well so the API validates the pair too: the ordering rule is
      # refused at startup, and a deployment that got it wrong should hear
      # about it from whichever process starts first.
      BILLING_PAST_DUE_DAYS: ${BILLING_PAST_DUE_DAYS:-7}
      BILLING_SUSPEND_AFTER_DAYS: ${BILLING_SUSPEND_AFTER_DAYS:-30}
    volumes:
      # Shared with the worker: one writes the file, the other serves it back.
      # This is a single-host arrangement, and it is the constraint ADR-023
      # records - with the API and the worker on different hosts, this volume
      # is not shared and the object-store implementation is required.
      - media-data:${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
      # Read-only: the API publishes what the backup wrote and must never be
      # able to alter it. A process that could edit its own backup status
      # could report a recovery point it does not have (ADR-075).
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    stop_grace_period: 30s
    restart: always

  worker:
    image: ${WASLA_IMAGE:?WASLA_IMAGE is required}
    command: ["worker"]
    # A real probe, replacing the API's liveness curl the image declares -
    # this process serves no HTTP and could never have answered it. The command
    # asks Redis whether every loop this container runs has beaten recently, so
    # a crashed or hung process stops reporting healthy within three intervals.
    #
    # What it does not prove is that a loop is making progress: a worker waiting
    # on a query that never returns keeps beating. That needs the in-flight
    # reaper, which reads the same keys - see TASKS.
    healthcheck:
      test: ["CMD", "scripts/entrypoint.sh", "worker-health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    # Container hardening. The image already runs as an unprivileged user
    # (Dockerfile: USER wasla, uid 1001); these bound what that user could do if
    # the process were taken over.
    #
    # `no-new-privileges` stops a setuid binary inside the image regaining
    # privilege - it is the one that makes dropping capabilities durable rather
    # than advisory. `cap_drop: ALL` is safe because nothing here binds a
    # privileged port: the application listens on 8000 and nginx is the only
    # thing in front of it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      # The worker serves no HTTP, so it publishes nothing itself: it writes
      # job outcomes and provider calls into Redis and the API renders them
      # (ADR-069). Off here means those counters are simply not written.
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # The same tracing configuration as the API, and it has to be: the whole
      # point is one trace across both processes, and a worker that sampled
      # differently or exported elsewhere would break the join it exists to
      # make. `OTEL_SERVICE_NAME` is what tells the two apart in the backend -
      # blank, this process reports `wasla-worker`.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # How long this process's claim on a job is good for. It renews every
      # third of this while it lives, so a crash is noticed in about that time
      # and a long job is never stolen from a worker still running it
      # (ADR-074). Must match the API's, which publishes the same queues.
      QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:-120}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      # --- Media storage (ADR-077) ---
      #
      # Both processes get the same values, and they must: the worker writes an
      # attachment and the API serves it back. A deployment where the two
      # disagreed would accept files into one store and read from another.
      #
      # `local` keeps the shared volume below and is a single-host arrangement.
      # `s3` is what removes that, and selecting it with an incomplete
      # configuration refuses to start rather than silently writing to disk.
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-26214400}
      # `${VAR:-}`, never `${VAR:?}`: a deployment that has not switched the
      # object store on must still come up, and the application's own validator
      # is what refuses a *half* configured one (ADR-062).
      #
      # Deliberately NOT the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY pair the
      # backup service holds. Media and backups are different buckets under
      # different credentials, so an application container that is taken over
      # cannot reach the copies of the database (ADR-075). The deployment drift
      # guard asserts both directions of that.
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
      MEDIA_S3_SERVER_SIDE_ENCRYPTION: ${MEDIA_S3_SERVER_SIDE_ENCRYPTION:-}
      MEDIA_S3_TIMEOUT_SECONDS: ${MEDIA_S3_TIMEOUT_SECONDS:-30}
      # Zero disables the retention sweep, which is the default: how long a
      # customer's attachments are kept is a decision this file cannot make
      # (ADR-078).
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-0}
      MEDIA_RETENTION_BATCH_SIZE: ${MEDIA_RETENTION_BATCH_SIZE:-200}
      MEDIA_RETENTION_POLL_SECONDS: ${MEDIA_RETENTION_POLL_SECONDS:-86400}
      MEDIA_UPLOAD_GRACE_SECONDS: ${MEDIA_UPLOAD_GRACE_SECONDS:-900}
      MEDIA_UPLOAD_RECOVERY_POLL_SECONDS: ${MEDIA_UPLOAD_RECOVERY_POLL_SECONDS:-300}
      MEDIA_UPLOAD_RECOVERY_BATCH_SIZE: ${MEDIA_UPLOAD_RECOVERY_BATCH_SIZE:-100}
      # The same key ring the API has, and it must be the same value: the worker
      # decrypts a workspace's credential to send with it, so a worker missing a
      # key the API used cannot send for that workspace at all.
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:-}
      DEFAULT_PLAN_CODE: ${DEFAULT_PLAN_CODE:-starter}
      # Empty runs every kind. Set to a comma-separated subset to scale the
      # loops apart - "campaign" during a large broadcast, or media and agent
      # apart from ingestion and follow-ups, since moving bytes and running
      # inference want differently sized pools.
      WORKER_KINDS: ${WORKER_KINDS:-}

      # --- Feature integrations (ADR-062) ---
      #
      # The worker's half. Optional in the same way and for the same reason as
      # the API's block above: `${VAR:-}` throughout, with each feature's own
      # validator refusing a half-configured one.

      # Read to build emailed links, and required by the settings validator
      # wherever email is enabled.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}

      # Email. This is the process that *sends*, which is why RESEND_API_KEY is
      # here and on no other container - `build_email_provider` validates it at
      # startup in the process that uses it, rather than the settings model
      # demanding a credential from containers that never send.
      #
      # No RESEND_WEBHOOK_SECRET, and that is the same rule applied the other
      # way round: only the API serves the delivery webhook, so only the API
      # can verify one. It used to be here because the shared settings
      # validator demanded it; that requirement now lives in the API process
      # (`integrations.email.require_delivery_verification`), so each half of
      # the Resend configuration reaches exactly one container (ADR-063).
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-8}
      EMAIL_WORKER_POLL_SECONDS: ${EMAIL_WORKER_POLL_SECONDS:-10}

      # No GOOGLE_* here, deliberately. Nothing this process runs touches OIDC,
      # and with GOOGLE_ENABLED absent its settings do not ask for a client
      # secret - so the credential exists in exactly one container.

      # Payments, for the renewal collection half of the billing sweep.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
      PAYMOB_MOTO_INTEGRATION_ID: ${PAYMOB_MOTO_INTEGRATION_ID:-}
      # The credential the transaction-inquiry API takes, which is not the
      # secret key. Without it a collection attempt whose callback never
      # arrived cannot be resolved (ADR-088).
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_REGION: ${PAYMOB_REGION:-egypt}

      # Dunning (ADR-061). This is the process that acts on them.
      BILLING_PAST_DUE_DAYS: ${BILLING_PAST_DUE_DAYS:-7}
      BILLING_SUSPEND_AFTER_DAYS: ${BILLING_SUSPEND_AFTER_DAYS:-30}
    volumes:
      - media-data:${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    # Longer than the API's. A worker mid-inference has an HTTP call outstanding
    # and a database transaction open; killing it there dead-letters a job that
    # was about to succeed. It stops taking new work on SIGTERM and finishes
    # what it holds.
    stop_grace_period: 60s
    restart: always

  # A one-shot backup, run by the host's scheduler rather than by a loop in
  # this stack. Behind a profile so an ordinary `up` does not start it, and
  # built on the *database* image rather than the application one because
  # `pg_dump` has to match the server's major version and the image that
  # certainly does is the one running the server (docs/BACKUP.md).
  #
  #   docker compose -f docker-compose.prod.yml --profile backup run --rm backup
  backup:
    # Its own image: `pg_dump` must match the server's major version, and the
    # off-host upload needs a client the database image does not carry. See
    # Dockerfile.backup for why neither belongs in the application image.
    image: ${WASLA_BACKUP_IMAGE:-wasla-backup:local}
    build:
      context: .
      dockerfile: Dockerfile.backup
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "/opt/wasla/scripts/backup_postgres.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # The same URL the application uses, so the deployment describes its
      # database once and cannot describe it two different ways.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_DIR: /backups
      BACKUP_STATUS_PATH: /backups/status.json
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Where the dump goes so that losing this host does not lose it.
      # Required in production: `upload_backup.sh` refuses to report success
      # with no destination unless BACKUP_ALLOW_LOCAL_ONLY says so, and this
      # file deliberately never sets that (ADR-075).
      BACKUP_DESTINATION: ${BACKUP_DESTINATION:-none}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-wasla}
      # Set for any S3-compatible store that is not AWS - MinIO, R2, Wasabi,
      # Backblaze. Left empty for AWS itself.
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
      # Encryption at rest for the artifact, and required rather than optional:
      # `upload_backup.sh` refuses to send a dump without it and refuses to
      # record a success unless the store confirms the object is encrypted
      # (ADR-090). Defaulted to AES256 here so a deployment that sets a
      # destination and forgets this one is encrypted rather than plaintext.
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-AES256}
      BACKUP_S3_SSE_KMS_KEY_ID: ${BACKUP_S3_SSE_KMS_KEY_ID:-}
      # Read by `aws` from the environment, never from a command line. Neither
      # the API nor the worker is given these: a compromised application
      # container must not be able to read or delete the backups.
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      # A host path rather than a named volume, deliberately: this is staging,
      # and an operator has to be able to reach it from outside Docker when
      # they are recovering (docs/BACKUP.md).
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certbot's webroot and its certificates. Both are host paths rather than
      # named volumes because the renewal timer runs on the host, outside this
      # stack: a certificate a container cannot see is one nginx cannot serve.
      - ${CERTBOT_WEBROOT:-./certbot/www}:/var/www/certbot:ro
      - ${CERTBOT_CERTS:-/etc/letsencrypt}:/etc/letsencrypt:ro
    ports:
      # 80 carries the ACME challenge and the redirect to HTTPS.
      - "80:80"
      # 8443 is the proxy's own listener, and it speaks **plain HTTP** until the
      # TLS block in nginx.conf is enabled - which is why it is not published as
      # 443 here. Publish it as "443:443" only after switching that block on and
      # confirming certificates exist; doing it before would put an unencrypted
      # listener on the port every client assumes is encrypted.
      #
      # Bound to the loopback interface so an operator can verify the proxy
      # locally without exposing it. See docs/DEPLOYMENT.md.
      - "127.0.0.1:8443:8443"
    depends_on:
      - api
    networks:
      internal:
        # Fixed, so TRUSTED_PROXY_IPS above can name it. Trusting one address
        # rather than the whole subnet keeps the forwarding headers believable
        # from the proxy alone, not from every container on the network.
        ipv4_address: 10.89.0.10
    restart: always

volumes:
  postgres-data:
  redis-data:
  media-data:

networks:
  internal:
    driver: bridge
    # An explicit subnet, because the proxy needs a fixed address the
    # application can be told to trust and Docker's automatic allocation
    # differs per host. 10.89.0.0/24 sits outside Docker's default address
    # pools (172.17-172.31 and 192.168.0.0/16), so it does not collide with a
    # network somebody else's stack already created.
    ipam:
      config:
        - subnet: 10.89.0.0/24
