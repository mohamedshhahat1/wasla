# Production stack.
#
# Every secret is interpolated from the deployment environment and required:
# compose fails fast rather than starting with an insecure default. Migrations
# run as a one-shot service so they are applied exactly once per release.
name: wasla-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: always

  migrate:
    image: ${WASLA_IMAGE:?WASLA_IMAGE is required}
    command: ["migrate"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    image: ${WASLA_IMAGE:?WASLA_IMAGE is required}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
      RUN_MIGRATIONS: "false"
    volumes:
      # Shared with the worker: one writes the file, the other serves it back.
      # This is a single-host arrangement, and it is the constraint ADR-023
      # records - with the API and the worker on different hosts, this volume
      # is not shared and the object-store implementation is required.
      - media-data:${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    stop_grace_period: 30s
    restart: always

  worker:
    image: ${WASLA_IMAGE:?WASLA_IMAGE is required}
    command: ["worker"]
    # The image's HEALTHCHECK curls the API's liveness endpoint, and this
    # process serves no HTTP. Inheriting it reports a perfectly healthy worker
    # as unhealthy for as long as it runs, which is worse than no signal: it
    # makes `docker ps` lie, hangs anything waiting on `service_healthy`, and
    # trains an operator to ignore the health column. Disabled rather than
    # faked. A real probe needs the loops to publish a heartbeat - see TASKS.
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
      # Empty runs every kind. Set to a comma-separated subset to scale the
      # media and agent loops apart from ingestion and follow-ups - reading
      # files is bandwidth-bound where inference is not.
      WORKER_KINDS: ${WORKER_KINDS:-}
    volumes:
      - media-data:${MEDIA_STORAGE_PATH:-/var/lib/wasla/media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    # Longer than the API's. A worker mid-inference has an HTTP call outstanding
    # and a database transaction open; killing it there dead-letters a job that
    # was about to succeed. It stops taking new work on SIGTERM and finishes
    # what it holds.
    stop_grace_period: 60s
    restart: always

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - internal
    restart: always

volumes:
  postgres-data:
  redis-data:
  media-data:

networks:
  internal:
    driver: bridge
