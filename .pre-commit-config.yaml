# Mirrors the CI quality gates so failures surface before pushing.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # The working tree, not the history. `security.yml` runs gitleaks over every
  # commit, which catches a secret after it has already leaked; this catches it
  # in the staged diff, which is the only moment it can still be stopped.
  # Same pinned image and same configuration, so a value allowlisted for one is
  # allowlisted for both.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml, --redact]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^app/
        additional_dependencies:
          - pydantic>=2.10
          - pydantic-settings>=2.7
