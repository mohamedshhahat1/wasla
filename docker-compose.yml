# Local development stack.
#
# The worker service is intentionally absent: background workers are Phase 8.
# PostgreSQL uses the pgvector image because RAG (Phase 6) requires the vector
# extension, which the initial migration enables.
name: wasla

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: wasla
      POSTGRES_DB: wasla
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasla -d wasla"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@postgres:5432/wasla
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
