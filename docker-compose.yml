# Local development stack.
#
# PostgreSQL uses the pgvector image because RAG (Phase 6) requires the vector
# extension, which the initial migration enables.
name: wasla

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: wasla
      POSTGRES_DB: wasla
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasla -d wasla"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@postgres:5432/wasla
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      MEDIA_STORAGE_PATH: /var/lib/wasla/media
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      # Shared with the worker, which writes what the API reads back. This is a
      # single-host arrangement and the reason ADR-023 exists: the moment there
      # are two hosts, the object-store implementation replaces the local one.
      - media-data:/var/lib/wasla/media
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@postgres:5432/wasla
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_PATH: /var/lib/wasla/media
      # Every kind by default. Set to a comma-separated subset - "media" or
      # "ingestion,follow_up" - to run them in separate replicas.
      WORKER_KINDS: ""
    volumes:
      - ./app:/app/app:ro
      - media-data:/var/lib/wasla/media
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API applies migrations locally (RUN_MIGRATIONS), so the worker waits
      # for it rather than starting against a schema that does not exist yet.
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media-data:
