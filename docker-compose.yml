# Local development stack.
#
# PostgreSQL uses the pgvector image because RAG (Phase 6) requires the vector
# extension, which the initial migration enables.
name: wasla

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: wasla
      POSTGRES_DB: wasla
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasla -d wasla"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@postgres:5432/wasla
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      UVICORN_RELOAD: "true"
      MEDIA_STORAGE_PATH: /var/lib/wasla/media
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      # Shared with the worker, which writes what the API reads back. This is a
      # single-host arrangement and the reason ADR-023 exists: the moment there
      # are two hosts, the object-store implementation replaces the local one.
      - media-data:/var/lib/wasla/media
    # The entrypoint's own "api" branch, not a uvicorn line. Overriding the
    # command skips that branch, and with it the migrations RUN_MIGRATIONS
    # asks for - which left a fresh stack running against an empty database.
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://wasla:wasla@postgres:5432/wasla
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_PATH: /var/lib/wasla/media
      # Every kind by default: media, agent, ingestion, follow_up, campaign,
      # billing. Set to a comma-separated subset - "media", "campaign" or
      # "ingestion,follow_up" - to run them in separate replicas.
      WORKER_KINDS: ""
    volumes:
      - ./app:/app/app:ro
      - media-data:/var/lib/wasla/media
    command: ["worker"]
    # A real probe, replacing the API's liveness curl the image declares -
    # this process serves no HTTP and could never have answered it. The command
    # asks Redis whether every loop this container runs has beaten recently.
    # `start_period` is longer than the beat interval so a container is not
    # marked unhealthy before its first beat.
    healthcheck:
      test: ["CMD", "scripts/entrypoint.sh", "worker-health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API applies migrations locally (RUN_MIGRATIONS), so the worker waits
      # for it rather than starting against a schema that does not exist yet.
      api:
        condition: service_started
    restart: unless-stopped

  # An S3-compatible object store, for developing and testing the `s3` media
  # backend without an account anywhere (ADR-077).
  #
  # Behind a profile, so `docker compose up` does not start it: the default
  # local backend is disk, and a store nobody has configured would be a
  # container running for nothing. Bring it up deliberately:
  #
  #   docker compose --profile objectstore up -d minio
  #   docker run --rm --network host --entrypoint sh minio/mc:latest -c \
  #     "mc alias set local http://localhost:9100 wasla-media wasla-media-secret && \
  #      mc mb --ignore-existing local/wasla-media"
  #
  # then set MEDIA_STORAGE_BACKEND=s3 and the MEDIA_S3_* values from
  # `.env.example` in your `.env`, which both services already forward.
  #
  # The credentials here are development credentials in a file that is checked
  # in, and are therefore not secrets. Nothing in this stack is reachable from
  # outside the host.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["objectstore"]
    environment:
      MINIO_ROOT_USER: wasla-media
      MINIO_ROOT_PASSWORD: wasla-media-secret
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      # 9100 rather than 9000, which collides with a great many other things a
      # developer already has running.
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media-data:
  minio-data:
