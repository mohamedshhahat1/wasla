# Reverse proxy example for Wasla.
#
# TLS is NOT included. Certificates must be provisioned by the operator (for
# example with Certbot or an upstream load balancer) and the commented HTTPS
# server block below enabled. Do not run the plain HTTP listener publicly.

upstream wasla_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Meta webhook payloads and knowledge base uploads stay well under this.
    client_max_body_size 10m;
    client_body_timeout 30s;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://wasla_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket upgrade support for future realtime inbox features.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # Probe endpoints are proxied but kept out of the access log.
    location = /health/live {
        access_log off;
        proxy_pass http://wasla_api;
        proxy_set_header Host $host;
    }
}

