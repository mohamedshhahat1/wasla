# Reverse proxy example for Wasla.
#
# TLS IS NOT INCLUDED AND CANNOT BE. Certificates are issued to a domain by a
# certificate authority; nothing in this repository knows the domain, and a
# self-signed certificate shipped here would be worse than none - it would look
# like TLS while failing every client that checks.
#
# What is here: the HTTP listener, which redirects to HTTPS and answers the
# ACME challenge, and a complete HTTPS server block. Enable the second once
# certificates exist. The procedure is in docs/DEPLOYMENT.md.
#
# Do not expose the plain HTTP listener publicly for anything but the redirect
# and the ACME path. Bearer tokens, WhatsApp payloads and customer messages all
# cross this proxy.

upstream wasla_api {
    server api:8000;
    keepalive 32;
}

# Shared by both listeners so a header is never set in one place and forgotten
# in the other.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Certbot's HTTP-01 challenge. Served before the redirect below, because a
    # redirect to a certificate that does not exist yet cannot be verified -
    # which is the deadlock a first issuance runs into.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else goes to HTTPS. 301 rather than 302: this is permanent,
    # and a client that caches it is doing the right thing.
    #
    # Comment this out only for a deployment terminating TLS upstream (a load
    # balancer, an ingress). In that case the upstream must set
    # X-Forwarded-Proto, or the application will believe every request arrived
    # in plaintext.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Commented until certificates exist. `nginx -t` fails on an ssl_certificate
    # path that is not there, so an operator enabling this before issuance gets
    # a proxy that will not start rather than one silently serving HTTP.
    #
    # listen 443 ssl;
    # http2 on;
    # server_name api.example.com;
    #
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    #
    # # TLS 1.2 is kept for compatibility; 1.0 and 1.1 are not offered at all.
    # ssl_protocols TLSv1.2 TLSv1.3;
    # # The client's preference wins on 1.3, where every offered suite is sound.
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    #
    # # OCSP stapling: the client learns the certificate is unrevoked without a
    # # round trip to the CA, which is a latency win and a privacy one.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/api.example.com/chain.pem;

    listen 8443;
    server_name _;

    server_tokens off;

    # Meta webhook payloads and knowledge base uploads stay well under this.
    # The application enforces its own cap as well (MAX_REQUEST_BYTES), because
    # nginx is one deployment topology rather than a property of the software.
    client_max_body_size 10m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS belongs on the TLS listener only, and is commented with it: sending
    # it over plain HTTP is meaningless, and sending it before certificates are
    # reliably renewing locks clients out of a site that stops answering.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://wasla_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The authentication rate limiter counts by this (ADR-032). Without it
        # every client behind the proxy shares one identity and one budget.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket upgrade support for future realtime inbox features.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Longer than the application's own request timeout, so a handler that
        # overruns is cut off by the application - which answers 504 with the
        # project's error envelope - rather than by the proxy, which answers
        # with an HTML page the API's clients cannot parse.
        proxy_read_timeout 75s;

        proxy_buffering off;
    }

    # Probe endpoints are proxied but kept out of the access log.
    location = /health/live {
        access_log off;
        proxy_pass http://wasla_api;
        proxy_set_header Host $host;
    }
}
